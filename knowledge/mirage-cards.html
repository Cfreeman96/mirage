    links:[["Manual: Echo","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Delay","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"time", dev:"Spectral Time",
    prompt:"<b>Spectral Time</b> can freeze a sound forever or make shimmering metallic echoes. How does it pull that off?",
    answer:"<b>Spectral Time</b> works in the <b>spectral (frequency) domain</b> — it splits your sound into its individual frequency components (like a prism splitting light) and manipulates them over time. It has two sections, usable alone or chained (Freezer → Delay). The <b>Freezer</b> captures a snapshot of the sound's spectrum and <b>sustains it infinitely</b> — turning any note or chord into an endless pad — triggered manually (with Fade In/Out) or automatically on <b>transients</b> or synced intervals. The <b>Delay</b> is a <b>spectral delay</b>: <b>Shift</b> detunes each successive echo's frequencies (metallic repeats) and <b>Tilt</b> delays different frequencies by different amounts so the echo <b>smears</b> across the spectrum. <b>Feedback</b> builds the tails; <b>Dry/Wet</b> blends the delayed signal. A spectrogram shows dry (yellow) vs wet (blue) over time.",
    you:"Guido's using this on your track — reach for the Freezer to turn a lead or pad note into an infinite ambient bed, or the spectral Delay for metallic, spacey echo tails a normal Delay can't make.",
    tryThis:"On a pad, enable just the Freezer in Manual mode, set a ~200 ms Fade In, and hit Freeze on a lush chord — it sustains forever. Then switch on the Delay and add a little Shift for a metallic shimmer.",
    jargon:[["Spectral / frequency domain","working with a sound split into its frequency components over time, instead of the raw waveform."],["Freeze","capturing a spectral snapshot and holding it indefinitely — an infinite sustain."],["Shift & Tilt","spectral-delay controls: Shift detunes each echo's frequencies; Tilt delays different frequencies by different amounts, smearing the tail."]],
    links:[["Manual: Spectral Time","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=EBuB6G9ik1A"]] },

  // ===== MODULATION =====
  { cat:"mod", dev:"Auto Pan-Tremolo",
    prompt:"Panning mode vs Tremolo mode on <b>Auto Pan-Tremolo</b> — what does each one modulate? (They're now the same device.)",
    answer:"Same LFO engine, different target. <b>Panning</b> moves the signal's <b>position</b> across the stereo field (left↔right). <b>Tremolo</b> modulates the signal's <b>amplitude</b> (rhythmic volume, staying centered). In Live 12.3 the device was renamed <b>Auto Pan-Tremolo</b> to reflect both modes. You set the LFO's rate (free or synced), depth, and a Modulation Attack that keeps transients centered/preserved.",
    you:"You always chose Panning (for width/movement) and never Tremolo — the right call for your goal. Tremolo would be a rhythmic volume pulse (helicopter chop, synth stutter).",
    tryThis:"On a hat loop: Panning mode, sync the LFO to 1/8, keep Amount low for subtle stereo life. Then flip to Tremolo and hear it throb in volume instead.",
    jargon:[["LFO","the slow wave doing the moving — see the LFO card."],["Panning","modulating stereo position (left↔right)."],["Tremolo","modulating volume up and down (stays centered)."]],
    links:[["Manual: Auto Pan-Tremolo","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=-g9qyHVSd_k"]] },

  { cat:"mod", dev:"Chorus-Ensemble",
    prompt:"How does <b>Chorus-Ensemble</b> make a thin mono synth sound lush and wide?",
    answer:"<b>Chorus-Ensemble</b> layers slightly delayed, slightly <b>detuned</b> copies of your signal and modulates their timing with an <b>LFO</b> — so a single mono sound becomes a shimmering, wider ensemble (one voice becoming a small choir). <b>Rate</b> sets the modulation speed (low = gentle phasing, high = drastic chorus), <b>Amount</b> the depth, and <b>Feedback</b> intensifies the character (invert it for a hollow tone). <b>Warmth</b> adds gentle distortion/filtering. It has Chorus, Ensemble and Vibrato modes.",
    you:"It's on your <b>lead</b> (and the brake piano uses a chorus-type move) — that's where the lush width comes from.",
    tryThis:"On a mono lead: moderate Rate, a little Amount, keep feedback low. Bypass to hear it collapse back to narrow and plain.",
    jargon:[["Detune","copies slightly out of tune with the original — creates thickness/shimmer."],["Modulated delay","tiny, moving delays that make the copies swirl."],["Vibrato mode","pitch wobble only (feedback disabled)."]],
    links:[["Manual: Chorus-Ensemble","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=25Uiav5UA9c"]] },

  { cat:"mod", dev:"Chorus-Ensemble — modes",
    prompt:"On <b>Chorus-Ensemble</b>, what's the difference between <b>Chorus</b>, <b>Ensemble</b> and <b>Vibrato</b> modes?",
    answer:"All three run on the same engine — delayed, pitch-wavering copies of your sound — and differ in how many copies there are and whether they're blended with the dry at all. <b>Chorus</b> adds <b>two</b> time-modulated delayed copies on top of the original for classic width and shimmer. <b>Ensemble</b> uses <b>three</b> copies with evenly spread modulation phases for a richer, smoother, more intense swirl (modeled on a lush '70s pedal). <b>Vibrato</b> adds <i>no</i> copy at all — it just <b>modulates the sound's own pitch</b> more deeply, so you get a wavering warble instead of width (feedback is disabled here).",
    you:"It's on your lead — Chorus and Ensemble are where the lush width comes from. If you ever want a seasick pitch wobble instead of width, that's Vibrato.",
    tryThis:"Keep Rate and Amount fixed and flip modes: Chorus widens, Ensemble widens more and lusher, Vibrato instead makes the pitch wobble in place.",
    jargon:[["Chorus (2 copies)","original + two detuned delayed copies → width and shimmer."],["Ensemble (3 copies)","three copies with spread modulation phases → richer, smoother swirl."],["Vibrato (no copy)","pitch modulation of the sound itself → warble, not width."]],
    links:[["Manual: Chorus-Ensemble","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=25Uiav5UA9c"]] },

  { cat:"mod", dev:"Phaser-Flanger",
    prompt:"<b>Phaser-Flanger</b> holds three effects. What's the difference between <b>Phaser</b>, <b>Flanger</b> and <b>Doubler</b>?",
    answer:"One device, three modulation effects driven by LFOs. <b>Phaser</b> sweeps a set of <b>notch filters</b> through the sound — a lush, wandering 'whoosh' — by feeding a phase-shifted copy back in. <b>Flanger</b> mixes in a very short, time-modulated delayed copy with feedback, creating a metallic <b>comb-filter</b> 'jet-plane' sweep. <b>Doubler</b> adds slightly delayed copies to fake <b>double-tracking</b> — thickness without the obvious sweep. A <b>Safe Bass</b> high-pass keeps the low end out of the effect.",
    you:"You used the <b>Phaser</b> on your lead-ambient part — 'selected notches, dry/wet 70%' — giving it slow, sweeping motion.",
    tryThis:"On a pad, compare Phaser vs Flanger at a slow rate. Phaser = smooth wandering notches; Flanger = tighter metallic whoosh.",
    jargon:[["Notch filter","removes a narrow frequency band; sweeping several creates the phaser sound."],["Comb filter","a series of notches (like a comb) that gives the flanger its metallic tone."],["Double-tracking","stacking near-identical takes for thickness — what Doubler imitates."]],
    links:[["Manual: Phaser-Flanger","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=bZjzOSqWn1s"]] },

  { cat:"mod", dev:"Shifter",
    prompt:"<b>Shifter</b> has three modes — <b>Pitch</b>, <b>Freq</b>, <b>Ring</b>. What does each do, and which adds that 'grainy/metallic' edge?",
    answer:"<b>Shifter</b> moves the pitch or frequency of a sound. <b>Pitch</b> shifts musically in <b>semitones</b> (Coarse) and <b>cents</b> (Fine) — for harmonies/octaves. <b>Freq</b> moves every frequency up/down by a fixed number of <b>Hz</b> (not musical): tiny amounts give subtle tremolo/phasing, larger amounts get <b>dissonant and metallic</b>. <b>Ring</b> is ring modulation — it adds and subtracts a set frequency for clangorous, bell-like tones (Drive distortion lives only here). The grainy/metallic edge you liked comes from small <b>Freq</b> (or Ring) shifting.",
    you:"You used a shifter 'a little bit to make it more grainy' near the clap — that's the Freq/Ring character.",
    tryThis:"On a synth stab, use Freq mode with a tiny shift (a few Hz). Hear it shimmer and go slightly metallic. Bypass to lose that grain.",
    jargon:[["Pitch shift (semitones/cents)","musical transposition — up/down in note steps."],["Frequency shift (Hz)","moving all frequencies by a fixed Hz — non-musical, metallic at higher amounts."],["Ring modulation","adding & subtracting a frequency for bell-like, clangorous tones."]],
    links:[["Manual: Shifter","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=uqY8K8otbp0"]] },

  { cat:"mod", dev:"Shaper",
    prompt:"<b>Shaper</b> confused you before — it's the modulator inside <b>Bootsandcats</b>. In plain terms, what does it actually do?",
    answer:"Easiest way in: <b>Shaper is like an LFO, but you <i>draw the shape yourself</i>.</b> It's a <b>modulator</b> — it makes no sound; instead it <b>moves a knob for you</b>, over and over, following a shape you draw. That shape is a <b>breakpoint envelope</b> (a curve made of draggable points). You set how fast it repeats (<b>Rate</b> — free, or tempo-synced), then <b>Map</b> it to a parameter: click <b>Map</b>, then click the knob you want it to control (up to 8). <b>Modulation</b> mode <i>adds</i> its movement on top of the knob's current value (still tweakable); <b>Remote</b> takes the knob over completely. <b>Bipolar</b> swings both above and below the value; <b>Unipolar</b> pushes one direction only; <b>Amount</b> = how far it pushes.",
    you:"This is the engine inside <b>Bootsandcats</b> — the thing you're using right now. There, the Shaper draws a 'duck' curve and maps it to a Utility's <b>Gain</b>, dipping the bass on every beat (a hand-drawn, click-free sidechain). That's basically the <i>only</i> place you've used it — exactly why the card felt abstract before it had something to point to.",
    tryThis:"Open the Shaper inside Bootsandcats and just look: the drawn curve dips down and ramps back up — that shape <i>is</i> the pump. Drag one of its breakpoints and watch the bass ducking change. Drawn shape → mapped to Utility Gain = the whole trick.",
    jargon:[["Modulator","a device that moves other parameters instead of making sound — like an LFO or Shaper."],["Breakpoint envelope","the shape you draw out of draggable points; it loops over and over."],["Map","click Map, then click a knob to make the Shaper control it (up to 8 knobs)."],["Modulation vs Remote","Modulation adds movement on top of the knob's value (still tweakable); Remote takes the knob over fully."],["Bipolar / Unipolar","Bipolar swings both ways around the value; Unipolar pushes one direction only."]],
    links:[["Manual: Max for Live devices","https://www.ableton.com/en/manual/max-for-live-devices/"]] },

  { cat:"mod", dev:"Bootsandcats (Shaper sidechain)",
    prompt:"Guido's <b>Bootsandcats</b> rack pumps any track in time with the kick — without real sidechain. How does it actually work?",
    answer:"<b>Bootsandcats</b> is an Audio Effect Rack that packages the <b>Shaper + 2× Utility</b> trick into drag-and-drop form (the name is the beatbox for a four-on-the-floor kick). Inside, a <b>Shaper</b> draws a repeating 'duck' curve — dip down on the beat, ramp back up — and <b>maps it onto a Utility's Gain</b>. With the Shaper's <b>Rate set to 1/4</b> (tempo-synced), the duck fires four times per bar, so the track's volume pumps in perfect time with a four-on-the-floor kick — no kick routing, no compressor. The Macros expose the controls: <b>Boots</b> = how deep the pump is, <b>Rate</b> = how fast, <b>Flip it</b> = invert the curve.",
    you:"This is the packaged version of the Shaper + 2-Utility pseudo-sidechain already on your bass. Drop it on the tracks you want to duck — bass, pads, chords — <b>not</b> the kick.",
    tryThis:"Put Bootsandcats on your bass, set Rate to 1/4, and raise Boots until it breathes with the kick. Mute the kick and the bass still pumps on every beat — because it's synced, not triggered.",
    jargon:[["Four-on-the-floor","a kick on every beat (1,2,3,4) — the backbone of house; 'boots and cats' is how you beatbox it."],["Shaper","a Max for Live modulator that draws a repeating shape and maps it to a parameter (here, Utility Gain)."],["Synced vs triggered","the pump follows the tempo grid (always in time) instead of reacting to an audio kick."]],
    links:[["Manual: Utility","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Shaper (M4L)","https://www.ableton.com/en/manual/max-for-live-devices/"]] },

  { cat:"mod", dev:"Bootsandcats — why two Utilities",
    prompt:"The <b>Bootsandcats</b> rack has <b>two Utilities</b>, not one. What's the advantage of splitting it in two?",
    answer:"It's <b>division of labor and clean gain staging</b>. <b>Utility #1</b> is the <b>duck stage</b> — the Shaper modulates only <i>its</i> Gain, so it does exactly one job: the rhythmic volume pump. <b>Utility #2</b> is a <b>stable stage</b> at fixed gain that handles <b>Width</b> (stereo) and <b>Bass Mono</b>, and sets the final output. Keeping them separate means the pumping never disturbs your stereo image or mono-bass, and your output level stays independent of <i>how deep</i> you pump. If one Utility did everything, changing the pump depth would also shift your final level and tangle with your width/bass settings — much harder to control. Bonus: bass-mono at both stages keeps the low end solid all the way through the pump.",
    you:"On your rack that's exactly why Utility #1's Gain reads a moving −11.3 dB (being ducked) while Utility #2 sits at 0 dB with Width 100% — one pumps, one stays put.",
    tryThis:"Open the rack and watch Utility #1's Gain needle move with the beat (that's the Shaper), while Utility #2's Gain stays still. Raise Boots — only #1 reacts; your width and output level stay stable.",
    jargon:[["Gain staging","managing level at each step so one control's job doesn't mess up another's."],["Duck stage","the Utility whose Gain the Shaper modulates to create the pump."],["Bass Mono","folding the lows to mono so the low end stays solid even while the level pumps."]],
    links:[["Manual: Utility","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  // ===== INSTRUMENTS & RACKS =====
  { cat:"inst", dev:"Wavetable",
    prompt:"Your bass and plucks are built on <b>Wavetable</b>. What's a 'wavetable,' what does the <b>Position</b> knob do, and why add a <b>sub oscillator</b>?",
    answer:"<b>Wavetable</b> is a synth whose oscillators play through a <b>wavetable</b> — a stack of many different waveforms. The <b>Position</b> control picks (or sweeps through) which waveform you hear, morphing the tone as it moves — that's the signature 'evolving' Wavetable sound. The <b>sub oscillator</b> adds a simple low tone underneath for weight: at Tone 0% it's a pure sine (clean sub), and you can drop it an octave or two. Two filters plus a modulation section (envelopes + LFOs) shape and animate everything.",
    you:"Your <b>bass, art pluck, lead and risers</b> are all Wavetable — the sub osc is what makes the bass feel physically low.",
    tryThis:"On the bass patch, mute the sub osc — hear it thin out. Turn it back on, set its Tone to 0% for a clean sine sub, and drop it one octave.",
    jargon:[["Wavetable","a stack of waveforms the synth can move between — think a flipbook of different tones."],["Position","which 'page' of that flipbook you're hearing; sweeping it morphs the sound over time."],["Sub oscillator","an extra low tone added below the main sound for weight — felt more than heard."]],
    links:[["Manual: instruments","https://www.ableton.com/en/manual/live-instrument-reference/"],["Video","https://www.youtube.com/watch?v=9wovKSfR66A"]] },

  { cat:"inst", dev:"Sampler",
    prompt:"You put a <b>Sampler</b> on your vocals but 'didn't touch the ADSR.' What is ADSR, and what would changing it do?",
    answer:"<b>Sampler</b> (and its simpler sibling <b>Simpler</b>) plays audio samples as a playable instrument. <b>ADSR</b> is its amplitude envelope — four stages shaping each note's volume over time: <b>Attack</b> (how fast it fades in), <b>Decay</b> (fall to the sustain level), <b>Sustain</b> (the held level while the note is down), <b>Release</b> (the tail after you let go). Leaving it untouched means the sample plays naturally; lengthen Attack and notes fade in, shorten Release and tails cut off fast. Sampler also maps many samples across <b>zones</b> (key/velocity ranges) to build realistic multisampled instruments.",
    you:"Your vocal Sampler plays with its natural envelope — a good next experiment is shaping Release to control how the tails ring.",
    tryThis:"On the vocal Sampler, shorten Release and hear notes cut off sooner; lengthen Attack for a soft fade-in. Small moves change the feel a lot.",
    jargon:[["ADSR","Attack, Decay, Sustain, Release — the four stages shaping a note's volume over time."],["Envelope","a control that changes over the life of a note."],["Multisample / zones","many samples mapped across the keyboard/velocity for realism."]],
    links:[["Manual: instruments","https://www.ableton.com/en/manual/live-instrument-reference/"],["Video","https://www.youtube.com/watch?v=rKGkthvnDSA"]] },

  { cat:"inst", dev:"Drum Rack",
    prompt:"What is a <b>Drum Rack</b>, and what are <b>choke groups</b> for?",
    answer:"A <b>Drum Rack</b> is a container that holds a whole kit on a 4×4 grid, where <b>each pad is its own chain</b> — its own sampler/instrument plus its own effects and mixer. That's why you can process one drum without touching the others. <b>Choke groups</b> let pads silence each other: put an open and closed hi-hat in the same group and triggering the closed hat cuts off the open one — just like a real hi-hat pedal. Drum Racks also have built-in <b>sends/returns</b> so you can share one reverb across the kit.",
    you:"You built kits in Drum Racks — your <b>replacement kick</b>, and the <b>snare</b> (a 4-instrument percussion rack duplicated and soloed to the snare).",
    tryThis:"Put your open and closed hats in the same choke group. Now the closed hat cuts the open one — tight, realistic hats.",
    jargon:[["Chain","one pad's full signal path — instrument + effects + mixer."],["Choke group","pads set to silence each other (like a real hi-hat)."],["Sends/returns","shared effect channels inside the rack the pads can feed."]],
    links:[["Manual: Drum Racks","https://www.ableton.com/en/manual/instrument-drum-and-effect-racks/"],["Video","https://www.youtube.com/watch?v=Y_tUyHebxko"]] },

  { cat:"inst", dev:"PML custom racks",
    prompt:"Your course has racks like 'Drum Full Parallel' and a '2×2 Tile' editor. What <i>is</i> a <b>Rack</b>, and how do you see inside one?",
    answer:"A <b>Rack</b> isn't a single device — it's a <b>container</b> that bundles several devices together and exposes a few big <b>Macro</b> knobs, each wired to control multiple parameters at once. PML's instructors built these: <b>'Drum Full Parallel'</b> is a parallel-compression rack (a crushed copy blended under the dry — see the Parallel card), and the <b>'2×2 Tile'</b> custom editor is just a Rack's Macro panel with a custom look. To demystify any rack, click the <b>unfold/chain-list</b> triangle on its title bar to see the real devices inside, and right-click a <b>Macro</b> to see exactly what it controls.",
    you:"'Drum Full Parallel' is on your clap; the '2×2 Tile' is on your brake piano — both are just Racks bundling devices behind Macros.",
    tryThis:"Unfold the 'Drum Full Parallel' rack and look inside — you'll find the dry path plus a heavily-compressed parallel path being blended.",
    jargon:[["Rack","a container bundling multiple devices into one panel."],["Macro","one big knob wired to control several parameters at once."],["Chain","a parallel signal path inside a rack."]],
    links:[["Manual: Racks","https://www.ableton.com/en/manual/instrument-drum-and-effect-racks/"]] },

  { cat:"inst", dev:"Audio Effect Rack",
    prompt:"How do you make a <b>delay</b> run <i>parallel</i> to your dry lead — two independent pathways you can balance separately — with an <b>Audio Effect Rack</b>?",
    answer:"An <b>Audio Effect Rack</b> is a container that can hold multiple <b>chains</b> running in <b>parallel</b>: every chain gets the <i>same</i> input at once, processes it through its own devices, and the outputs are mixed back together. So you make one chain your <b>dry lead</b> (its sound design) and a second chain your <b>delay</b> — both fed the same source, blended at the output, each with its own volume slider. That's the 'two pathways, fine-tune both without sacrificing one' setup: the delayed layer is a fully separate signal you can filter and ping-pong independently, instead of relying on a single delay's dry/wet.",
    you:"This is the rack you're building on your lead — Chain 1 = the lead's sound design, Chain 2 = a ping-pong delay low-passed to ~515 Hz so only the low end echoes, sitting dark and distinct under the bright dry lead.",
    tryThis:"Select your lead's devices → Group (Cmd/Ctrl+G) to make the Rack (Chain 1). Open the Chain List, drop a Delay into the empty area below to start Chain 2, set it to Ping Pong + low-pass ~515 Hz, then balance the two chain volume sliders. Solo each chain to dial it.",
    jargon:[["Chain","one parallel signal path inside a rack — with its own devices, volume and pan."],["Parallel vs serial","parallel chains each get the same input and are summed at the output; serial = one device after another."],["Chain List","the panel on the rack's left edge where chains branch; the drop area below adds a new chain."]],
    links:[["Manual: Racks","https://www.ableton.com/en/manual/instrument-drum-and-effect-racks/"],["Video: Parallel effect chains","https://www.youtube.com/watch?v=PGxvwjX0dU0"]] },

  { cat:"clean", dev:"RX 9 Voice De-click vs De-noise",
    prompt:"Guido used <b>RX 9 Voice De-click</b> and <b>Voice De-noise</b> on a vocal. Both are cleanup tools — what does each one actually remove?",
    answer:"Both are <b>iZotope RX 9</b> restoration plugins (third-party, not Ableton stock) that <i>remove problems</i> from a recording rather than shape tone — the difference is <b>what kind of noise</b> each targets. <b>Voice De-click</b> removes <b>short, sharp, momentary</b> artifacts — mouth clicks (lip/saliva smacks between words), pops, crackle, edit clicks — by detecting those brief spikes and repairing the waveform across them, leaving the voice intact. <b>Voice De-noise</b> removes <b>constant, steady background</b> noise — hiss, hum, air-conditioning, mic self-noise, room tone — by learning a 'fingerprint' of the ongoing noise and subtracting it across the whole signal. One-liner: <b>De-click = brief spikes; De-noise = the steady carpet underneath.</b>",
    you:"You've got real vocal parts (Sampler vocals, lead vocals). Clean the source with these <i>first</i> — before compression (which lifts the noise floor) and before reverb/delay (which smear and amplify clicks) — so junk doesn't get amplified downstream.",
    tryThis:"On a vocal sample: run De-click first to kill mouth clicks, then De-noise for the hiss/room tone. A/B each — the voice should stay natural; if it sounds thin or 'underwater,' you're removing too much, so back the amount off.",
    jargon:[["De-click","removes short, impulsive artifacts (mouth clicks, pops, crackle) by repairing the waveform across each spike."],["De-noise","removes steady broadband background noise (hiss, hum, room tone) by subtracting a learned noise profile."],["Noise floor","the constant low-level background noise under a recording — compression makes it more audible."],["Restoration","cleaning a recording: removing problems rather than adding character."]],
    links:[["iZotope RX 9 (third-party)","https://www.izotope.com/en/products/rx.html"]] },

  { cat:"clean", dev:"De-essing",
    prompt:"A vocal's <b>S</b> sounds come out harsh and clicky. What's <b>de-essing</b>, and how do you do it in Ableton?",
    answer:"<b>De-essing</b> means taming <b>sibilance</b> — the sharp, hissy energy in 's', 'sh', 't' and 'f' sounds, which usually lives around <b>5–9 kHz</b>. The quick way Guido showed: an <b>EQ Eight</b> band with a <b>high Q</b> (narrow), cutting at the sibilant frequency — find it by boosting a narrow band and sweeping the top end until the 'S' jumps out, then cut there. Just know that EQ cut is <b>static</b> — it's always cutting, so it can dull the whole vocal's highs. The <b>dynamic</b> (cleaner) way: a <b>Compressor</b> with its <b>sidechain EQ</b> set to listen only to that sibilant band, so it ducks <i>only</i> when an 'S' actually spikes and leaves the rest of the highs bright. (A dedicated de-esser plugin does this automatically.)",
    you:"Your current vocal came pre-processed, so you may not need it — but when you record or use a raw vocal that's spitty on the S's, this is the fix.",
    tryThis:"In EQ Eight: make a narrow high-Q bell, boost it ~+9 dB, and sweep 4–10 kHz until the 'S' is painfully loud — that's your sibilant frequency. Flip the boost to a cut of a few dB. For a cleaner result, do it dynamically with a Compressor sidechained to that band.",
    jargon:[["Sibilance","the harsh high-frequency energy in 's/sh/t/f' sounds — typically ~5–9 kHz."],["De-essing","reducing sibilance so vocals aren't clicky or sharp."],["Static vs dynamic","a fixed EQ cut always cuts; a dynamic de-esser only ducks when the 'S' spikes, keeping the highs otherwise bright."],["Sidechain EQ","filtering what a compressor 'listens' to, so it reacts only to a chosen frequency band."]],
    links:[["Manual: EQ Eight","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Compressor sidechain","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"eq", dev:"EQ Three",
    prompt:"Ableton already has EQ Eight — so what's <b>EQ Three</b> for, and why can it only boost +6 dB but cut to −∞?",
    answer:"<b>EQ Three</b> is a <b>DJ-mixer-style</b> EQ: three broad bands — <b>Low, Mid, High</b> — each with a gain from <b>−∞ to +6 dB</b>. That lopsided range is the whole point: it's built to <b>remove/kill</b> a band, not to boost precisely. Pull the Low to −∞ and the entire bassline vanishes; slam it back for a drop. Each band has an <b>On/Off (kill) button</b> — perfect mapped to a key for live transitions — and three LEDs show what's playing in each band. Two crossover knobs (<b>FreqLo / FreqHi</b>) set where the bands split (e.g. Lo 500 Hz, Hi 2 kHz → low 0–500, mid 500–2k, high 2k+), and a <b>24 dB / 48 dB</b> switch sets how <i>sharply</i> the bands separate (48 = tighter, cleaner kills). Broad performance moves, not surgery.",
    you:"Different tool from your workhorse EQ Eight: reach for <b>EQ Eight</b> for detailed mixing (cut a resonance, shape tone), and <b>EQ Three</b> for big DJ-style moves — dropping the bass out in a breakdown, killing the highs for a filter effect, or quick 3-band sculpting.",
    tryThis:"On a full loop, set the 48 dB slope and pull the Low band to −∞ for a breakdown — no bass. Bring it back on the downbeat and it hits like a drop. Map the Low On/Off to a key to do it live.",
    jargon:[["Kill EQ","an EQ whose bands cut all the way to −∞ (silence) — for fully removing a frequency range."],["Crossover (FreqLo / FreqHi)","the frequencies where the Low/Mid/High bands split."],["24 / 48 dB slope","how steeply the bands separate — 48 dB is tighter and cleaner, so a kill doesn't bleed into neighboring bands."]],
    links:[["Manual: EQ Three","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dyn", dev:"Split Band Compressor (DIY multiband)",
    prompt:"Guido built a <b>Split Band Compressor</b> rack from EQ Threes and a Compressor. What is it, and how does it de-ess?",
    answer:"It's a <b>homemade multiband compressor</b> made from native devices. An Audio Effect Rack holds <b>three parallel chains</b>, each starting with an <b>EQ Three</b> set to solo one band — chain 1 keeps only <b>Low</b> (Mid + High killed), chain 2 only <b>Mid</b>, chain 3 only <b>High</b>. Because the chains are parallel, Low + Mid + High <b>sum back to the full signal</b> (transparent with nothing processing). The trick: process <i>one band on its own</i> — here a <b>Compressor only on the High chain</b>, so only the highs get compressed while lows/mids pass untouched. Since harsh 'S' sounds live in the highs, that makes it a <b>de-esser</b> — and with the Compressor's SC Filter at ~7.74 kHz it clamps only when sibilance spikes. Crossovers set the splits (FreqLow 250 Hz, FreqHi 2.5 kHz, 48 dB slope).",
    you:"This ties together four cards you already have: <b>Audio Effect Rack</b> parallel chains, <b>EQ Three</b> (kill bands), <b>Compressor sidechain filter</b> (de-ess), and the multiband idea from <b>OTT</b>. It's the fully-controllable native version of a multiband compressor.",
    tryThis:"Build it: a Rack with 3 chains, an EQ Three in each soloing L / M / H (FreqLow 250, FreqHi 2.5k, 48 dB). Put a Compressor on the High chain with SC Filter ~7 kHz. Now you're compressing only the harsh highs — a dynamic de-esser.",
    jargon:[["Multiband compression","splitting audio into frequency bands and compressing each independently."],["Band-splitting (EQ Three ×3)","three parallel EQ Threes each soloing one band, recombined into the full signal."],["Crossover phase tradeoff","splitting then recombining can cause slight phase interaction at the band edges — the cost of DIY vs a dedicated multiband/compander."]],
    links:[["Manual: EQ Three","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dyn", dev:"Vocal leveling compressor (recipe)",
    prompt:"How do you set a compressor to <b>level a vocal</b> so it sits steady in the mix — and what's it doing to the dynamic range?",
    answer:"The goal is to shrink the vocal's <b>dynamic range</b> (the gap between its loud and quiet moments) so it stays consistent — without sounding squashed. Guido's recipe: <b>low Threshold</b> (~−23 dB) so it reaches into the whole performance, not just peaks (leveling, not peak-catching); <b>high Ratio</b> (~12:1, near-limiting) for firm control; <b>wide/soft Knee</b> (~18 dB) so that hard ratio eases in gradually and only the biggest peaks feel the full clamp; <b>slow Attack</b> (~120 ms) so consonants/transients pass through and stay crisp; <b>quick Release</b> (~30 ms) so it recovers naturally between words; <b>Peak</b> detection to catch the actual peaks; then <b>Makeup</b> (~+5 dB) to lift it all back up. Loud comes down, quiet comes up, range collapses — but peaks still poke through, so it's even, not lifeless.",
    you:"This is the vocal chain Guido walked you through. The magic combo is <b>high ratio + wide knee</b>: strong control that only fully bites on the loudest moments, so it never sounds crushed. (The 'Compressor' card is about <i>which</i> compressor to pick — this is <i>how to set it</i>.)",
    tryThis:"Watch the GR meter: lower Threshold until you're pulling a few dB on the loud words; set Ratio high but widen the Knee so it eases in; keep Attack slow so words stay crisp; then Makeup to match. A/B bypass — same loudness, just steadier.",
    jargon:[["Dynamic range","the gap between the loudest and quietest moments; leveling shrinks it."],["Leveling vs peak-catching","leveling (low threshold) evens the whole performance; peak-catching (high threshold) only tames rare spikes."],["High ratio + soft knee","strong compression that ramps in gradually — firm on peaks, gentle elsewhere, so it's controlled but transparent."]],
    links:[["Manual: Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] }
];

let filter = "all";
let idx = 0;
let order = [];
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const filtersEl = document.getElementById('filters');

function cssVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function buildFilters(){
  const present = ["all", ...Object.keys(CATS).filter(c=>CARDS.some(k=>k.cat===c))];
  filtersEl.innerHTML = present.map(c=>{
    const label = c==="all" ? "All ("+CARDS.length+")" : CATS[c].label;
    return `<span class="chip${c===filter?' active':''}" data-c="${c}">${label}</span>`;
  }).join('');
  filtersEl.querySelectorAll('.chip').forEach(ch=> ch.addEventListener('click', ()=>{ filter=ch.dataset.c; reshuffle(); }));
}

function pool(){ return CARDS.map((c,i)=>i).filter(i=> filter==="all" || CARDS[i].cat===filter); }

function reshuffle(){
  order = pool();
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  idx=0; buildFilters(); draw();
}

function draw(){
  if(order.length===0){ stage.innerHTML='<div class="card">No cards here yet.</div>'; counter.textContent=''; return; }
  const c = CARDS[order[idx]];
  const cat = CATS[c.cat];
  const canAI = (typeof window!=='undefined' && window.cowork && typeof window.cowork.askClaude==='function');
  stage.innerHTML = `
  <div class="card">
    <div class="badges">
      <span class="badge cat-${c.cat}">${cat.label}</span>
      <span class="badge dev">${c.dev}</span>
    </div>
    <div class="prompt">${c.prompt}</div>
    <div class="think">Answer it in your head first…</div>
    <div class="reveal-wrap"><button id="revealBtn">Reveal answer</button></div>
    <div class="answer" id="answer">
      <div class="sec"><div class="sec-h">The idea</div><p class="idea">${c.answer}</p></div>
      <div class="sec"><div class="you">${c.you}</div></div>
      <div class="sec"><div class="sec-h">Try this</div><div class="try">${c.tryThis}</div></div>
      <div class="sec"><div class="sec-h">Jargon, decoded</div><div class="jargon">${c.jargon.map(j=>`<p><b>${j[0]}</b> — ${j[1]}</p>`).join('')}</div></div>
      ${canAI ? `<button class="ai-btn" id="aiBtn">↳ Explain it even simpler</button><div class="ai" id="aiText"></div>` : ``}
      <div class="links">${c.links.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]} ↗</a>`).join('')}</div>
    </div>
  </div>`;
  counter.textContent = `Card ${idx+1} of ${order.length}${filter==="all"?"":" · "+CATS[filter].label}`;

  document.getElementById('revealBtn').addEventListener('click', function(){
    document.getElementById('answer').classList.add('show'); this.parentElement.style.display='none';
  });
  const aiBtn = document.getElementById('aiBtn');
  if(aiBtn){
    aiBtn.addEventListener('click', async ()=>{
      const box=document.getElementById('aiText'); box.classList.add('show'); aiBtn.style.display='none'; box.textContent='Thinking…';
      try{
        const c2 = CARDS[order[idx]];
        const plain = (c2.answer).replace(/<[^>]+>/g,'');
        const res = await window.cowork.askClaude("Re-explain this Ableton concept in 2 short sentences with a plain real-world analogy. Use ONLY the provided text; invent no new device details.", [c2.dev+": "+plain]);
        box.textContent = (typeof res==='string') ? res : (res && (res.text||res.content)) || "Couldn't fetch a simpler take right now.";
      }catch(e){ box.textContent="Couldn't fetch a simpler take right now."; }
    });
  }
}

function next(){ if(order.length){ idx=(idx+1)%order.length; draw(); window.scrollTo({top:0,behavior:'smooth'}); } }
document.getElementById('next').addEventListener('click', next);
reshuffle();

function buildBrowse(){
  const listEl = document.getElementById('browseList');

    q=(q||'').trim().toLowerCase();
    let html='';
    Object.keys(CATS).forEach(catKey=>{
      const items = CARDS.filter(c=>c.cat===catKey && (!q || (c.dev+' '+stripTags(c.prompt)+' '+stripTags(c.answer)).toLowerCase().includes(q)));
      if(!items.length) return;
      html += '<div class="browse-group"><h3>'+CATS[catKey].label+' · '+items.length+'</h3>';
      items.forEach(c=>{
        html += '<div class="browse-item"><div class="browse-head">'
          + '<span class="badge cat-'+c.cat+'">'+CATS[c.cat].label+'</span>'
          + '<span class="browse-title">'+c.dev+'</span>'
          + '<span class="browse-chev">›</span></div>'
          + '<div class="browse-body">'
          + '<div class="sec"><div class="sec-h">The idea</div><p class="idea">'+c.answer+'</p></div>'
          + '<div class="sec"><div class="you">'+c.you+'</div></div>'
          + '<div class="sec"><div class="sec-h">Try this</div><div class="try">'+c.tryThis+'</div></div>'
          + '<div class="sec"><div class="sec-h">Jargon, decoded</div><div class="jargon">'+c.jargon.map(j=>'<p><b>'+j[0]+'</b> — '+j[1]+'</p>').join('')+'</div></div>'
          + '<div class="links">'+c.links.map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+' ↗</a>').join('')+'</div>'
          + '</div></div>';
      });
      html += '</div>';
    });
    listEl.innerHTML = html || '<div class="browse-empty">No matches.</div>';
    listEl.querySelectorAll('.browse-head').forEach(h=> h.addEventListener('click', ()=> h.parentElement.classList.toggle('open')));
  }
  render('');
  searchEl.addEventListener('input', ()=>render(searchEl.value));
}

const DRILLS = [
  {id:"bassline", name:"Basslines", target:25, desc:"Write & sound-design a fresh bassline from scratch."},
  {id:"synth", name:"Synth patches", target:25, desc:"Design a lead / pad / pluck from an init patch."},
  {id:"drums", name:"Drum grooves", target:25, desc:"Build an original 8-bar drum pattern."},

];
const DRILL_NAME = {}; DRILLS.forEach(function(d){ DRILL_NAME[d.id]=d.name; }); DRILL_NAME.efflab="Effect Lab";
function gymLoad(){ try{ var d=JSON.parse(localStorage.getItem('mirage_gym'))||{}; if(!d.reps)d.reps={}; if(!d.log)d.log=[]; if(!d.weeklyGoal)d.weeklyGoal=20; return d; }catch(e){ return {reps:{}, log:[], weeklyGoal:20}; } }
function gymSave(d){ try{ localStorage.setItem('mirage_gym', JSON.stringify(d)); }catch(e){} }
function gymAddRep(id, note){ var d=gymLoad(); d.reps[id]=(d.reps[id]||0)+1; d.log.push({t:Date.now(), d:id, n:(note||"").trim()}); gymSave(d); }
function gymRemoveRep(id){ var d=gymLoad(); if((d.reps[id]||0)>0){ d.reps[id]--; for(var i=d.log.length-1;i>=0;i--){ if(d.log[i].d===id){ d.log.splice(i,1); break; } } gymSave(d); } }
function gymSetGoal(v){ var d=gymLoad(); d.weeklyGoal=Math.max(1, v||1); gymSave(d); }
function dayKey(t){ var dt=new Date(t); return dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate(); }
function relTime(t){ var s=(Date.now()-t)/1000; if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; var days=Math.floor(s/86400); return days===1?'yesterday':days+' days ago'; }
function gymStats(){
  var d=gymLoad(), now=Date.now(), DAY=86400000;
  var total=0; for(var k in d.reps){ total+=d.reps[k]; }
  var week=d.log.filter(function(e){return now-e.t < 7*DAY;}).length;
  var last=d.log.length ? Math.max.apply(null, d.log.map(function(e){return e.t;})) : null;
  var lastTxt = last ? relTime(last) : 'never';
  var set={}; d.log.forEach(function(e){ set[dayKey(e.t)]=1; });
  var streak=0, cur=new Date();
  if(!set[dayKey(now)]) cur.setDate(cur.getDate()-1);
  while(set[dayKey(cur.getTime())]){ streak++; cur.setDate(cur.getDate()-1); }
  return {total:total, week:week, last:last, lastTxt:lastTxt, streak:streak, goal:d.weeklyGoal};
}
var insightView='year'; try{ insightView=localStorage.getItem('mirage_iview')||'year'; }catch(e){}
function gymCountsByDay(){ var d=gymLoad(), m={}; d.log.forEach(function(e){ var k=dayKey(e.t); m[k]=(m[k]||0)+1; }); return m; }
function weekStart(t){ var dt=new Date(t); var day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function seriesDaily(n){ var m=gymCountsByDay(), out=[], now=new Date(); for(var i=n-1;i>=0;i--){ var dt=new Date(now); dt.setDate(dt.getDate()-i); out.push({label:(dt.getMonth()+1)+'/'+dt.getDate(), sub:['S','M','T','W','T','F','S'][dt.getDay()], count:m[dayKey(dt.getTime())]||0}); } return out; }
function seriesWeekly(n){ var d=gymLoad(), b={}; d.log.forEach(function(e){ var k=dayKey(weekStart(e.t).getTime()); b[k]=(b[k]||0)+1; }); var out=[], now=weekStart(Date.now()); for(var i=n-1;i>=0;i--){ var dt=new Date(now); dt.setDate(dt.getDate()-i*7); out.push({label:(dt.getMonth()+1)+'/'+dt.getDate(), sub:'wk', count:b[dayKey(dt.getTime())]||0}); } return out; }
function seriesMonthly(n){ var d=gymLoad(), b={}; d.log.forEach(function(e){ var dt=new Date(e.t); b[dt.getFullYear()+'-'+dt.getMonth()]=(b[dt.getFullYear()+'-'+dt.getMonth()]||0)+1; }); var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; var out=[], now=new Date(); for(var i=n-1;i>=0;i--){ var dt=new Date(now.getFullYear(), now.getMonth()-i, 1); out.push({label:MN[dt.getMonth()], sub:String(dt.getFullYear()).slice(2), count:b[dt.getFullYear()+'-'+dt.getMonth()]||0}); } return out; }
function byWeekday(){ var d=gymLoad(), a=[0,0,0,0,0,0,0]; d.log.forEach(function(e){ a[new Date(e.t).getDay()]++; }); return a; }
function gymHeatmap(){ var m=gymCountsByDay(), end=new Date(); end.setHours(23,59,59,999); var start=weekStart(end.getTime()); start.setDate(start.getDate()-52*7); var cur=new Date(start), weeks=[]; while(cur<=end){ var col=[]; for(var day=0;day<7;day++){ var future=cur>end; col.push({k:dayKey(cur.getTime()), c:future?null:(m[dayKey(cur.getTime())]||0), future:future}); cur.setDate(cur.getDate()+1); } weeks.push(col); } return weeks; }
function barChart(series){ var max=1; series.forEach(function(x){ if(x.count>max)max=x.count; }); var bars=series.map(function(x){ return '<div class="bcol"><div class="bcol-val">'+(x.count||'')+'</div><div class="btrack"><div class="bbar" style="height:'+Math.round(x.count/max*100)+'%"></div></div><div class="blab">'+x.label+'</div><div class="bsub">'+(x.sub||'')+'</div></div>'; }).join(''); return '<div class="barchart">'+bars+'</div>'; }
function heatLevel(c){ if(c==null)return 'hlx'; if(c===0)return 'hl0'; if(c<3)return 'hl1'; if(c<6)return 'hl2'; if(c<10)return 'hl3'; return 'hl4'; }
function drawHeatmap(){ var weeks=gymHeatmap(); var cols=weeks.map(function(col){ return '<div class="hmcol">'+col.map(function(cell){ return '<span class="hmcell '+heatLevel(cell.future?null:cell.c)+'" title="'+cell.k+': '+(cell.c==null?0:cell.c)+' reps"></span>'; }).join('')+'</div>'; }).join(''); return '<div class="hmwrap"><div class="hmgrid">'+cols+'</div></div><div class="hmleg">Less <span class="hmcell hl0"></span><span class="hmcell hl1"></span><span class="hmcell hl2"></span><span class="hmcell hl3"></span><span class="hmcell hl4"></span> More</div>'; }
function drawInsights(){ var box=document.getElementById('insights'); if(!box)return; var html=''; if(insightView==='daily')html=barChart(seriesDaily(14)); else if(insightView==='weekly')html=barChart(seriesWeekly(10)); else if(insightView==='monthly')html=barChart(seriesMonthly(12)); else html=drawHeatmap(); var wd=byWeekday(), names=['S','M','T','W','T','F','S'], wmax=1; wd.forEach(function(v){ if(v>wmax)wmax=v; }); var wbars=wd.map(function(v,i){ return '<div class="wdcol"><div class="wdtrack"><div class="wdbar" style="height:'+Math.round(v/wmax*100)+'%"></div></div><div class="wdlab">'+names[i]+'</div><div class="wdval">'+v+'</div></div>'; }).join(''); html+='<div class="wdpanel"><div class="wdtitle">Reps by weekday <span class="wdhint">— spot your free days</span></div><div class="wdchart">'+wbars+'</div></div>'; box.innerHTML=html; }
function buildGym(){
  var el=document.getElementById('gym');
  function render(){
    var d=gymLoad(), s=gymStats(), now=Date.now(), DAY=86400000;
    var set={}; d.log.forEach(function(e){ set[dayKey(e.t)]=1; });
    var dots=''; for(var i=6;i>=0;i--){ var t=now-i*DAY; dots+='<span class="dot'+(set[dayKey(t)]?' on':'')+'"></span>'; }
    var wpct=Math.min(100, Math.round(s.week/s.goal*100));
    var html='<div class="goalcard">'
      + '<div class="goalrow"><div class="goaltitle">This week</div>'
      + '<div class="goalnums"><b>'+s.week+'</b> / <input id="weeklyGoal" class="goalinput" type="number" min="1" value="'+s.goal+'"> reps</div></div>'
      + '<div class="bar-wrap"><div class="bar-fill" style="width:'+wpct+'%"></div></div>'
      + '<div class="gymlast"><b>'+s.streak+'</b>-day streak · <b>'+s.total+'</b> total · last in the gym <b>'+s.lastTxt+'</b> <span class="dots">'+dots+'</span></div>'
      + '</div>';
    DRILLS.forEach(function(dr){
      var reps=d.reps[dr.id]||0, cycles=Math.floor(reps/dr.target), curc=reps%dr.target, pct=Math.round(curc/dr.target*100);
      html += '<div class="drill"><div class="drill-top"><div><div class="drill-name">'+dr.name+(cycles>0?' <span class="cyc">×'+cycles+' done</span>':'')+'</div><div class="drill-desc">'+dr.desc+'</div></div>'
        + '<div class="drill-count">'+curc+'<span>/'+dr.target+'</span></div></div>'
        + '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
        + '<div class="drill-btns"><button class="rep-minus" data-id="'+dr.id+'">–</button>'
        + '<input class="rep-note" data-id="'+dr.id+'" type="text" placeholder="optional note — what did you make?">'
        + '<button class="rep-plus" data-id="'+dr.id+'">+1</button></div></div>';
    });
    html += '<div class="jsec"><h3>Insights</h3><div class="seg" id="insightSeg">'
      + '<button class="segbtn" data-v="daily">Daily</button><button class="segbtn" data-v="weekly">Weekly</button><button class="segbtn" data-v="monthly">Monthly</button><button class="segbtn" data-v="year">Year</button>'
      + '</div><div id="insights"></div></div>';
    var recent = d.log.slice(-15).reverse();
    var logHtml='';
    recent.forEach(function(e){ logHtml += '<div class="logrow"><span class="logdrill">'+(DRILL_NAME[e.d]||e.d)+'</span>'+(e.n?'<span class="lognote">'+e.n+'</span>':'<span class="lognote"></span>')+'<span class="logtime">'+relTime(e.t)+'</span></div>'; });
    html += '<div class="jsec"><h3>Recent activity</h3><div class="logbox">'+(logHtml||'<div class="browse-empty" style="padding:14px">No reps logged yet — tap +1 on a drill.</div>')+'</div></div>';
    html += '<div class="gymtools"><button id="gymExport" class="tool">⬇ Back up my data</button></div>';
    html += '<div class="gymnote">'+"Reps & notes save in this browser and persist on your live site. They won't carry into the Claude preview, and clearing browser data resets them — so back up now and then."+'</div>';
    el.innerHTML=html;
    el.querySelectorAll('.rep-plus').forEach(function(b){ b.addEventListener('click', function(){ var note=el.querySelector('.rep-note[data-id="'+b.dataset.id+'"]'); gymAddRep(b.dataset.id, note?note.value:''); render(); }); });
    el.querySelectorAll('.rep-minus').forEach(function(b){ b.addEventListener('click', function(){ gymRemoveRep(b.dataset.id); render(); }); });
    var gi=document.getElementById('weeklyGoal'); if(gi) gi.addEventListener('change', function(){ gymSetGoal(parseInt(gi.value,10)); render(); });
    var exp=document.getElementById('gymExport'); if(exp) exp.addEventListener('click', gymExport);
    el.querySelectorAll('.segbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.v===insightView); b.addEventListener('click', function(){ insightView=b.dataset.v; try{localStorage.setItem('mirage_iview',insightView);}catch(e){} el.querySelectorAll('.segbtn').forEach(function(x){x.classList.toggle('active', x.dataset.v===insightView);}); drawInsights(); }); });
    drawInsights();
  }
  render();
}
function gymExport(){
  try{
    var data=localStorage.getItem('mirage_gym')||'{"reps":{},"log":[]}';
    var blob=new Blob([data],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mirage-gym-backup.json'; a.click();
  }catch(e){}
}

// ---- Effect Lab ----
var LAB_SOURCES=["🥁 a drum loop","🎛️ a bassline","✨ a synth pluck","🌫️ a pad / chord","🎯 a lead","🎤 a vocal / one-shot","🎩 a hi-hat loop","🎹 piano / keys"];
var LAB_EFFECTS=[
  {n:"Compressor",k:"Threshold · Ratio · Attack/Release"},
  {n:"Glue Compressor",k:"Threshold · Ratio · Makeup"},
  {n:"EQ Eight",k:"Frequency · Gain · Q"},
  {n:"EQ Three",k:"Low/Mid/High kills · crossovers"},
  {n:"Auto Filter",k:"Cutoff · Resonance · LFO amount"},
  {n:"Utility",k:"Gain · Width · Bass Mono"},
  {n:"Roar",k:"Drive · Shaper Amount · Shaper Bias"},
  {n:"Overdrive",k:"Drive · Tone · X-Y band"},
  {n:"Saturator",k:"Drive · Curve type · Color"},
  {n:"Redux",k:"Rate (downsample) · Bit depth · Jitter"},
  {n:"Vocoder",k:"Carrier · Bands · Formant"},
  {n:"Delay",k:"Time (sync) · Feedback · Filter dot"},
  {n:"Echo",k:"Time · Feedback · Character (Wobble/Ducking)"},
  {n:"Reverb",k:"Predelay · Decay · Size"},
  {n:"Spectral Time",k:"Freeze / Fade · Shift · Feedback"},
  {n:"Auto Pan-Tremolo",k:"Rate · Amount · Pan vs Tremolo"},
  {n:"Chorus-Ensemble",k:"Rate · Amount · Mode"},
  {n:"Phaser-Flanger",k:"Mode · Rate · Feedback"},
  {n:"Shifter",k:"Mode (Pitch/Freq/Ring) · Amount · Dry/Wet"},
  {n:"Drum Buss",k:"Drive · Transients · Boom"},
  {n:"Multiband Dynamics (OTT)",k:"Amount · Bands · Up/Down"},
  {n:"Limiter",k:"Input · Ceiling · Release"}
];
var labEffect=null, labSources=[];
function labPickSources(){ var pool=LAB_SOURCES.slice(), out=[]; for(var i=0;i<3 && pool.length;i++){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); } return out; }
function labAssign(eff){ labEffect = eff || LAB_EFFECTS[Math.floor(Math.random()*LAB_EFFECTS.length)]; labSources = labPickSources(); }
function buildLab(){
  var el=document.getElementById('lab');
  if(!labEffect) labAssign();
  function render(){
    var opts='<option value="">Pick a device…</option>'+LAB_EFFECTS.map(function(e,i){ return '<option value="'+i+'"'+((labEffect&&labEffect.n===e.n)?' selected':'')+'>'+e.n+'</option>'; }).join('');
    el.innerHTML=
      '<div class="labhero"><div class="labkicker">Effect Lab</div><div class="labtitle">Learn a device by ear.</div>'
      + '<div class="labsub">Loop a few contrasting sounds, drop one effect, and sweep its knobs to hear what it does to each — no full track required.</div></div>'
      + '<div class="labpick"><button id="labRandom" class="primary">🎲 Surprise me</button><select id="labSelect" class="labselect">'+opts+'</select></div>'
      + '<div class="labcard"><div class="labeff">Today\'s device: <b>'+labEffect.n+'</b></div>'
      + '<div class="sec"><div class="sec-h">Build loops with</div><div class="labsrc">'+labSources.join('&nbsp;&nbsp;·&nbsp;&nbsp;')+'</div></div>'
      + '<div class="sec"><div class="sec-h">Sweep these</div><div class="labknobs">'+labEffect.k+'</div></div>'
      + '<div class="sec"><div class="sec-h">Protocol</div><ol class="labproto"><li>Loop each source in Session view.</li><li>Solo one, drop <b>'+labEffect.n+'</b>, and sweep each knob to its extremes.</li><li>Note what it does to <i>that</i> sound.</li><li>Move to the next source — hear how it differs.</li></ol></div>'
      + '<textarea id="labNote" class="labnote" placeholder="What did you hear? e.g. Predelay keeps the vocal clear; long decay washes the pad."></textarea>'
      + '<button id="labLog" class="primary">✓ Log this lab session</button><div id="labStatus" class="labstatus"></div></div>'
      + '<div class="jsec"><h3>First time? Build your loop bank</h3><div class="jcard">In Session view, drop a looping clip on 4–5 tracks — drums, bass, a synth, a pad, a vocal/one-shot. Save it (File → Save Live Set as Template, or just keep a "Lab" Set you duplicate). Reopen it anytime, drop an effect on a track, and audition across all of them.</div></div>';
    document.getElementById('labRandom').addEventListener('click', function(){ labAssign(); render(); });
    document.getElementById('labSelect').addEventListener('change', function(){ if(this.value!==''){ labEffect=LAB_EFFECTS[parseInt(this.value,10)]; labSources=labPickSources(); render(); } });
    document.getElementById('labLog').addEventListener('click', function(){ var note=document.getElementById('labNote').value.trim(); gymAddRep('efflab', labEffect.n+(note?' — '+note:'')); document.getElementById('labStatus').textContent='Logged ✓ — added to your Reps. Nice work.'; document.getElementById('labNote').value=''; });
  }
  render();
}

// ---- Third-party tools (suggested; capture, revisit later) ----
function toolsLoad(){ try{ var v=localStorage.getItem('mirage_tools'); if(v) return JSON.parse(v); }catch(e){} return null; }
function toolsSave(a){ try{ localStorage.setItem('mirage_tools', JSON.stringify(a)); }catch(e){} }
var SEED_TOOLS=[
  {name:"Type A — AudioThing", via:"Guido", note:"Enhancer plugin — reportedly a better take on what OTT does for thickening vocals."},
  {name:"RX — iZotope", via:"Guido", note:"Audio-restoration suite (De-click, De-noise, etc.). Clean the vocal FIRST — OTT/Type A exaggerate clicks & noise if the source isn't clean."},
  {name:"TDR Nova — Tokyo Dawn Records", via:"Charlie", note:"Free dynamic EQ (parallel) — surgical, frequency-specific dynamic control; great for de-essing and taming resonances that only spike sometimes."},
  {name:"GMaudio / Noir Labs racks", via:"Guido", note:"Boutique, cheap Ableton racks (~$20–30 for the set). GMaudio (groovmekanik): Clipper, VSEQ, Carver, Space Maker (FX). Noir Labs 'Workflow Bundle': Shortcut Buddy, Volume Buddy, Swiss Army Meter (workflow/metering). Guido will name his specific picks."}
];
function toolsSeed(){ var t=toolsLoad()||[]; SEED_TOOLS.forEach(function(sd){ if(!t.some(function(x){return x.name===sd.name;})){ t.push({name:sd.name, via:sd.via, note:sd.note, t:Date.now(), status:"To try"}); } }); toolsSave(t); return t; }
function toolsAdd(name, via, note){ var t=toolsLoad()||[]; t.unshift({name:name, via:via, note:note, t:Date.now(), status:"To try"}); toolsSave(t); }
function toolsDelete(i){ var t=toolsLoad()||[]; t.splice(i,1); toolsSave(t); }
function toolsCycle(i){ var order=["To try","Exploring","Using it","Passed"], t=toolsLoad()||[]; if(t[i]){ t[i].status=order[(order.indexOf(t[i].status)+1)%order.length]; toolsSave(t); } }
function buildTools(){
  var el=document.getElementById('tools'); toolsSeed();
  function render(){
    var arr=toolsLoad()||[];
    var html='<div class="jcard toolform">'
      + '<input id="tName" class="tinput" placeholder="Tool name (e.g. Type A)">'
      + '<input id="tVia" class="tinput" placeholder="Suggested by (e.g. Guido)">'
      + '<input id="tNote" class="tinput" placeholder="What it&#39;s for / why (optional)">'
      + '<button id="tAdd" class="primary" style="width:100%">+ Add tool</button></div>';
    if(!arr.length) html+='<div class="browse-empty" style="padding:14px">Nothing captured yet.</div>';
    arr.forEach(function(it,i){
      html+='<div class="toolitem"><div class="toolhead"><span class="toolname">'+it.name+'</span>'
        +'<span class="toolstatus" data-i="'+i+'" title="click to change status">'+(it.status||'To try')+'</span>'
        +'<button class="tooldel" data-i="'+i+'" title="remove">×</button></div>'
        +'<div class="toolvia">via '+(it.via||'—')+' · '+relTime(it.t)+'</div>'
        +(it.note?'<div class="toolnote">'+it.note+'</div>':'')+'</div>';
    });
    el.innerHTML=html;
    document.getElementById('tAdd').addEventListener('click', function(){ var n=document.getElementById('tName').value.trim(); if(!n)return; toolsAdd(n, document.getElementById('tVia').value.trim(), document.getElementById('tNote').value.trim()); render(); });
    el.querySelectorAll('.tooldel').forEach(function(b){ b.addEventListener('click', function(){ toolsDelete(parseInt(b.dataset.i,10)); render(); }); });
    el.querySelectorAll('.toolstatus').forEach(function(b){ b.addEventListener('click', function(){ toolsCycle(parseInt(b.dataset.i,10)); render(); }); });
  }
  render();
}

function keysLoad(){ try{ var v=localStorage.getItem('mirage_keys'); if(v) return JSON.parse(v); }catch(e){} return []; }
function keysSave(a){ try{ localStorage.setItem('mirage_keys', JSON.stringify(a)); }catch(e){} }
function keysAdd(k,d){ var a=keysLoad(); a.unshift({k:k,d:d}); keysSave(a); }
function keysDelete(i){ var a=keysLoad(); a.splice(i,1); keysSave(a); }
function buildKeys(){
  var el=document.getElementById('keys');
  el.innerHTML='<input id="kSearch" class="search" type="search" placeholder="Search shortcuts…">'
    + '<div class="jcard toolform"><input id="kKeys" class="tinput" placeholder="Keys (e.g. ⌘T)"><input id="kDesc" class="tinput" placeholder="What it does"><button id="kAdd" class="primary" style="width:100%">+ Add shortcut</button></div>'
    + '<div class="gymnote">Mac keys shown — on Windows, ⌘→Ctrl and ⌥→Alt. Grounded in the Live 12 manual; add your own below.</div>'
    + '<div id="keyList"></div>';
  function row(k,d,delI){ return '<div class="keyrow"><span class="kbd">'+k+'</span><span class="kdesc">'+d+'</span>'+(delI!=null?'<button class="keydel" data-ki="'+delI+'">×</button>':'')+'</div>'; }
  function renderList(){
    var q=(document.getElementById('kSearch').value||'').trim().toLowerCase();
    function match(k,d){ return !q || (k+' '+d).toLowerCase().indexOf(q)>-1; }
    var mine=keysLoad(), html='';
    var mrows=mine.map(function(it,i){ return match(it.k,it.d)?row(it.k,it.d,i):''; }).join('');
    if(mrows) html+='<div class="browse-group"><h3>My shortcuts</h3><div class="keybox">'+mrows+'</div></div>';
    SEED_SHORTCUTS.forEach(function(grp){ var rows=grp.items.filter(function(it){return match(it.k,it.d);}).map(function(it){return row(it.k,it.d,null);}).join(''); if(rows) html+='<div class="browse-group"><h3>'+grp.g+'</h3><div class="keybox">'+rows+'</div></div>'; });
    var lb=document.getElementById('keyList'); lb.innerHTML = html || '<div class="browse-empty" style="padding:14px">No matches.</div>';
    lb.querySelectorAll('.keydel').forEach(function(b){ b.addEventListener('click', function(){ keysDelete(parseInt(b.dataset.ki,10)); renderList(); }); });
  }
  document.getElementById('kSearch').addEventListener('input', renderList);
  document.getElementById('kAdd').addEventListener('click', function(){ var k=document.getElementById('kKeys').value.trim(), d=document.getElementById('kDesc').value.trim(); if(!k||!d)return; keysAdd(k,d); document.getElementById('kKeys').value=''; document.getElementById('kDesc').value=''; renderList(); });
  renderList();
}

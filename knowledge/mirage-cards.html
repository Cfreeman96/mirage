<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirage 🏝️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
<style>
  :root{
    color-scheme: light;
    --bg:#f6f5f2; --card:#ffffff; --ink:#1c1b1a; --muted:#6b6864; --line:#e7e4df;
    --accent:#d1471f; --accent-soft:#fbe9e2;
    --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
    --c-found:#3b5b80;  --c-found-bg:#e6edf6;
    --c-prin:#7a5b12;   --c-prin-bg:#f6efdd;
    --c-dyn:#b23a2e;    --c-dyn-bg:#fbe6e2;
    --c-eq:#1f6f5c;     --c-eq-bg:#e3f1ec;
    --c-dist:#9d4a12;   --c-dist-bg:#f7e8dc;
    --c-time:#4b4699;   --c-time-bg:#e9e7f6;
    --c-mod:#a53670;    --c-mod-bg:#f7e4ef;
    --c-inst:#5a5148;   --c-inst-bg:#efe9e2;
    --c-clean:#3f7d7a;  --c-clean-bg:#e2f0ef;
    --c-master:#4f5b6b; --c-master-bg:#e6eaf0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px; max-width:640px; margin:0 auto; -webkit-font-smoothing:antialiased;}
  header{margin:4px 2px 12px}
  .kicker{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
  h1{font-size:21px; margin:2px 0 4px; letter-spacing:-.01em}
  .sub{font-size:13px; color:var(--muted)}
  .filters{display:flex; gap:7px; flex-wrap:wrap; margin:12px 2px 4px}
  .chip{font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); cursor:pointer; -webkit-tap-highlight-color:transparent}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 17px; margin:14px 0;}
  .badges{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center}
  .badge{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:.02em}
  .badge.dev{background:#f0efec; color:var(--muted)}
  .cat-found{background:var(--c-found-bg); color:var(--c-found)}
  .cat-prin{background:var(--c-prin-bg); color:var(--c-prin)}
  .cat-dyn{background:var(--c-dyn-bg); color:var(--c-dyn)}
  .cat-eq{background:var(--c-eq-bg); color:var(--c-eq)}
  .cat-dist{background:var(--c-dist-bg); color:var(--c-dist)}
  .cat-time{background:var(--c-time-bg); color:var(--c-time)}
  .cat-mod{background:var(--c-mod-bg); color:var(--c-mod)}
  .cat-inst{background:var(--c-inst-bg); color:var(--c-inst)}
  .cat-clean{background:var(--c-clean-bg); color:var(--c-clean)}
  .cat-master{background:var(--c-master-bg); color:var(--c-master)}
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:0 2px 8px}
  .theme-toggle{width:auto; flex:none; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; box-shadow:var(--shadow)}
  .tabs{display:flex; gap:6px; flex-wrap:wrap}
  .tab{width:auto; flex:none; font-size:14px; font-weight:700; padding:9px 15px; border-radius:11px; background:var(--card); color:var(--muted)}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  section[hidden]{display:none}
  .search{width:100%; font:inherit; font-size:15px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); margin:0 0 10px; box-shadow:var(--shadow)}
  .browse-group{margin:16px 0 6px}
  .browse-group h3{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 2px 8px; font-weight:700}
  .browse-item{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); margin-bottom:8px; overflow:hidden}
  .browse-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .browse-title{font-weight:600; font-size:15px}
  .browse-chev{margin-left:auto; color:var(--muted); font-size:18px; transition:transform .15s ease}
  .browse-item.open .browse-chev{transform:rotate(90deg)}
  .browse-body{display:none; padding:0 14px 14px}
  .browse-item.open .browse-body{display:block}
  .browse-empty{color:var(--muted); font-size:14px; padding:12px 2px}
  .hero{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px 18px; margin-bottom:14px}
  .hero .name{font-size:26px; font-weight:800; letter-spacing:-.02em; margin:4px 0 4px}
  .hero .tag{color:var(--muted); font-size:14px; line-height:1.5}
  .jsec{margin:16px 0}
  .jsec h3{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0 2px 8px}
  .jcard{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px; margin-bottom:8px; font-size:14.5px}
  .jcard .goal{font-weight:700; font-size:15px}
  .jcard .goal-sub{color:var(--muted); font-size:13.5px; margin-top:3px}
  .jnow{border-left:3px solid var(--accent); background:#fff8f5; padding:11px 13px; border-radius:0 10px 10px 0; font-size:14.5px}
  body.dark .jnow{background:#2b1a12}
  .pill{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--c-eq-bg); color:var(--c-eq); margin-right:6px}
  .brandnav{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{font-weight:800; font-size:16px; letter-spacing:-.01em}
  .hero{background:linear-gradient(135deg, var(--accent-soft), var(--card))}
  .gymstats{display:flex; gap:10px; margin-bottom:12px}
  .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:12px 8px; text-align:center}
  .statnum{font-size:24px; font-weight:800; color:var(--accent)}
  .statlab{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px}
  .gymlast{font-size:14px; color:var(--muted); margin:0 2px 14px}
  .gymlast b{color:var(--ink)}
  .dots{display:inline-flex; gap:4px; margin-left:8px; vertical-align:middle}
  .dot{width:11px; height:11px; border-radius:3px; background:var(--line)}
  .dot.on{background:var(--accent)}
  .drill{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px; margin-bottom:10px}
  .drill-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .drill-name{font-weight:700; font-size:15px}
  .drill-desc{font-size:13px; color:var(--muted); margin-top:2px}
  .drill-count{font-size:20px; font-weight:800; white-space:nowrap}
  .drill-count span{font-size:13px; color:var(--muted); font-weight:600}
  .bar-wrap{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:11px 0}
  .bar-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .2s ease}
  .drill-btns{display:flex; gap:8px}
  .rep-plus{flex:none; width:auto; background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; padding:11px 16px; border-radius:10px}
  .rep-minus{flex:none; width:auto; padding:11px 16px; border-radius:10px; font-weight:700}
  .tool{width:auto; flex:none; font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px}
  .gymnote{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5}
  .rep-note{flex:1; width:auto; min-width:0; font:inherit; font-size:13px; padding:10px 11px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
  .goalcard{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
  .goalrow{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .goaltitle{font-weight:700; font-size:15px}
  .goalnums{font-size:15px; color:var(--muted)}
  .goalnums b{color:var(--ink); font-size:20px}
  .goalinput{width:52px; font:inherit; font-size:15px; text-align:center; padding:4px 6px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
  .cyc{font-size:11px; font-weight:700; color:var(--c-eq); background:var(--c-eq-bg); padding:2px 7px; border-radius:999px; vertical-align:middle; margin-left:4px}
  .logbox{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
  .logrow{display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line); font-size:13.5px}
  .logrow:last-child{border-bottom:none}
  .logdrill{font-weight:700; flex:none}
  .lognote{color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .logtime{color:var(--muted); font-size:12px; flex:none; margin-left:auto}
  .seg{display:flex; gap:6px; margin:0 0 12px; flex-wrap:wrap}
  .segbtn{width:auto; flex:none; font-size:13px; font-weight:700; padding:8px 13px; border-radius:9px; background:var(--card); color:var(--muted)}
  .segbtn.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .barchart{display:flex; gap:6px; align-items:flex-end; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 12px; overflow-x:auto}
  .bcol{flex:1; min-width:24px; display:flex; flex-direction:column; align-items:center; gap:4px}
  .bcol-val{font-size:11px; color:var(--muted); height:14px}
  .btrack{height:90px; width:100%; display:flex; align-items:flex-end}
  .bbar{width:100%; background:var(--accent); border-radius:5px 5px 0 0; min-height:2px; transition:height .2s ease}
  .blab{font-size:10.5px; font-weight:700; white-space:nowrap}
  .bsub{font-size:10px; color:var(--muted)}
  .hmwrap{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px; overflow-x:auto}
  .hmgrid{display:flex; gap:3px; min-width:max-content}
  .hmcol{display:flex; flex-direction:column; gap:3px}
  .hmcell{width:11px; height:11px; border-radius:2px; background:var(--line); display:inline-block}
  .hmcell.hlx{background:transparent}
  .hmcell.hl0{background:var(--line)}
  .hmcell.hl1{background:var(--accent); opacity:.30}
  .hmcell.hl2{background:var(--accent); opacity:.55}
  .hmcell.hl3{background:var(--accent); opacity:.78}
  .hmcell.hl4{background:var(--accent); opacity:1}
  .hmleg{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); margin-top:8px}
  .wdpanel{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px; margin-top:10px}
  .wdtitle{font-size:13px; font-weight:700; margin-bottom:10px}
  .wdhint{color:var(--muted); font-weight:400}
  .wdchart{display:flex; gap:8px; align-items:flex-end}
  .wdcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px}
  .wdtrack{height:56px; width:100%; display:flex; align-items:flex-end}
  .wdbar{width:100%; background:var(--c-eq); border-radius:5px 5px 0 0; min-height:2px}
  .wdlab{font-size:11px; font-weight:700}
  .wdval{font-size:10px; color:var(--muted)}
  .labhero{background:linear-gradient(135deg, var(--accent-soft), var(--card)); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px; margin-bottom:12px}
  .labkicker{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .labtitle{font-size:20px; font-weight:800; letter-spacing:-.01em; margin:3px 0}
  .labsub{font-size:14px; color:var(--muted); line-height:1.5}
  .labpick{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
  #labRandom{width:auto; flex:none}
  .labselect{flex:1; min-width:150px; font:inherit; font-size:14px; padding:11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
  .labcard{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px}
  .labeff{font-size:17px; margin-bottom:6px}
  .labsrc{font-size:15px; font-weight:600}
  .labknobs{font-size:15px; font-weight:600; color:var(--accent)}
  .labproto{margin:4px 0 0; padding-left:20px; font-size:14.5px; line-height:1.6}
  .labproto li{margin:2px 0}
  .labnote{width:100%; font:inherit; font-size:14px; padding:11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); min-height:64px; margin:14px 0 10px; resize:vertical}
  .labstatus{font-size:13px; color:var(--c-eq); font-weight:700; margin-top:8px; min-height:16px}
  .toolform{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
  .tinput{width:100%; font:inherit; font-size:14px; padding:11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
  .toolitem{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px; margin-bottom:8px}
  .toolhead{display:flex; align-items:center; gap:8px}
  .toolname{font-weight:700; font-size:16px}
  .toolstatus{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--c-eq-bg); color:var(--c-eq); cursor:pointer}
  .tooldel{width:auto; flex:none; margin-left:auto; padding:6px 11px; border-radius:9px; font-weight:700; font-size:14px; color:var(--muted)}
  .toolvia{font-size:12.5px; color:var(--muted); margin-top:4px}
  .toolnote{font-size:14px; margin-top:6px; line-height:1.5}
  .keybox{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
  .keyrow{display:flex; align-items:center; gap:12px; padding:10px 13px; border-bottom:1px solid var(--line); font-size:14px}
  .keyrow:last-child{border-bottom:none}
  .kbd{flex:none; min-width:66px; text-align:center; font-weight:700; font-size:13px; padding:6px 10px; border-radius:8px; background:var(--bg); border:1px solid var(--line); box-shadow:0 1px 0 var(--line)}
  .kdesc{flex:1}
  .keydel{width:auto; flex:none; margin-left:auto; padding:5px 10px; border-radius:8px; font-weight:700; font-size:14px; color:var(--muted)}
  /* ---- Dark mode ---- */
  body.dark{
    color-scheme:dark;
    --bg:#161514; --card:#211f1d; --ink:#ece9e4; --muted:#9a938a; --line:#343029;
    --accent:#ec6a41; --accent-soft:#3a241b;
    --c-found:#84accf; --c-found-bg:#1d2733;
    --c-prin:#d8b566;  --c-prin-bg:#2c2614;
    --c-dyn:#ea7a6d;   --c-dyn-bg:#331e1b;
    --c-eq:#54bb9f;    --c-eq-bg:#14302a;
    --c-dist:#d68f54;  --c-dist-bg:#2f2013;
    --c-time:#9a95dd;  --c-time-bg:#211e33;
    --c-mod:#d571a6;   --c-mod-bg:#301e2a;
    --c-inst:#bcae9f;  --c-inst-bg:#2a2621;
    --c-clean:#5cb3ad; --c-clean-bg:#122a28;
    --c-master:#93a1b5; --c-master-bg:#20262f;
  }
  body.dark .badge.dev{background:#2c2925; color:var(--muted)}
  body.dark .you{background:#2b1a12}
  body.dark .ai{background:#1b2430}
  body.dark .chip.active{background:var(--ink); color:#161514; border-color:var(--ink)}
  body.dark .bar{background:linear-gradient(180deg,rgba(22,21,20,0),var(--bg) 34%)}
  .prompt{font-size:17px; font-weight:600; line-height:1.45; margin:2px 0 4px}
  .think{font-size:12.5px; color:var(--muted); margin-top:8px; font-style:italic}
  .reveal-wrap{margin-top:14px}
  button{font:inherit; font-weight:700; font-size:15px; cursor:pointer; border-radius:13px;
    padding:14px 12px; border:1px solid var(--line); background:var(--card); color:var(--ink);
    box-shadow:var(--shadow); -webkit-tap-highlight-color:transparent; transition:transform .05s ease; width:100%;}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .answer{display:none; margin-top:6px; animation:fade .25s ease}
  .answer.show{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
  .sec{margin:15px 0 0}
  .sec-h{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:5px}
  .sec p{margin:0}
  .idea{font-size:15px}
  .you{border-left:3px solid var(--accent); background:#fff8f5; padding:9px 12px; border-radius:0 10px 10px 0; font-size:14.5px}
  .try{border-left:3px solid var(--c-eq); background:var(--c-eq-bg); padding:9px 12px; border-radius:0 10px 10px 0; font-size:14.5px}
  .jargon{border-left:3px solid var(--c-found); background:var(--c-found-bg); padding:6px 12px 8px; border-radius:0 10px 10px 0}
  .jargon p{margin:8px 0; font-size:14px; line-height:1.5}
  .jargon b{color:var(--c-found)}
  .links{display:flex; gap:14px; flex-wrap:wrap; margin-top:15px; padding-top:12px; border-top:1px solid var(--line)}
  .links a{font-size:13px; color:var(--accent); text-decoration:none; font-weight:600}
  .links a:hover{text-decoration:underline}
  .bar{position:sticky; bottom:0; display:flex; gap:10px; padding:12px 0 6px;
    background:linear-gradient(180deg,rgba(246,245,242,0),var(--bg) 34%)}
  .mini{text-align:center; font-size:12px; color:var(--muted); margin-top:6px}
  .ai-btn{margin-top:13px; font-size:13px; font-weight:600; color:var(--c-found); background:none; border:none; box-shadow:none; padding:0; text-align:left; width:auto; cursor:pointer}
  .ai-btn:hover{text-decoration:underline}
  .ai{display:none; margin-top:10px; border-left:3px solid var(--c-found); background:#eef2f9; padding:10px 12px; border-radius:0 10px 10px 0; font-size:14.5px}
  .ai.show{display:block}
</style>
</head>
<body>
<div class="topbar">
  <div class="brandnav">
    <span class="brand">Mirage 🏝️</span>
    <nav class="tabs">
      <button class="tab active" data-view="journey">Home</button>
      <button class="tab" data-view="quiz">Quiz</button>
      <button class="tab" data-view="browse">Browse</button>
      <button class="tab" data-view="gym">Reps</button>
      <button class="tab" data-view="lab">Lab</button>
      <button class="tab" data-view="tools">Tools</button>
      <button class="tab" data-view="keys">Shortcuts</button>
    </nav>
  </div>
  <button id="themeToggle" class="theme-toggle">☾ Dark</button>
</div>
<header>
  <div class="kicker">Mirage · Ableton Cards</div>
  <h1 id="viewTitle">Answer it in your head. Then reveal.</h1>
  <div class="sub" id="viewSub">72 cards · principles + all your devices · jargon decoded · grounded in the Live 12 manual &amp; your own track.</div>
</header>

<section id="view-quiz">
<div class="filters" id="filters"></div>
<div id="stage"></div>
<div class="bar"><button id="next" class="primary">Next card →</button></div>
<div class="mini" id="counter"></div>
</section>

<section id="view-browse" hidden>
  <input id="browseSearch" class="search" type="search" placeholder="Search devices &amp; concepts…">
  <div id="browseList"></div>
</section>

<section id="view-journey" hidden>
  <div id="journey"></div>
</section>

<section id="view-gym" hidden>
  <div id="gym"></div>
</section>

<section id="view-lab" hidden>
  <div id="lab"></div>
</section>

<section id="view-tools" hidden>
  <div id="tools"></div>
</section>

<section id="view-keys" hidden>
  <div id="keys"></div>
</section>

<script>
const CATS = {
  found:{label:"Foundations", v:"--c-found", bg:"--c-found-bg"},
  prin: {label:"Principle",   v:"--c-prin",  bg:"--c-prin-bg"},
  dyn:  {label:"Dynamics",    v:"--c-dyn",   bg:"--c-dyn-bg"},
  eq:   {label:"EQ & Filter", v:"--c-eq",    bg:"--c-eq-bg"},
  dist: {label:"Distortion",  v:"--c-dist",  bg:"--c-dist-bg"},

  { cat:"prin", dev:"Dynamic EQ — a surgical sidechain (TDR Nova)",

  { cat:"prin", dev:"Filter types",

  { cat:"prin", dev:"Sync divisions",
    prompt:"Delays and LFOs can be <b>synced</b> to the beat in values like 1/8, Dotted and Triplet. What do those mean?",

  { cat:"prin", dev:"Feedback",
    prompt:"On delays, choruses and flangers there's a <b>Feedback</b> control. What is it feeding back?",
    answer:"<b>Feedback</b> routes a portion of an effect's output back into its own input. On a <b>delay/echo</b>, more feedback = more repeats (each echo re-feeds the line, so it can trail toward infinity). On <b>chorus/flanger/phaser</b>, feedback intensifies the resonant, hollow character. Push it high and an effect can <b>self-oscillate</b> — building on itself into a runaway tone.",

  { cat:"prin", dev:"Gain staging",
    prompt:"What is <b>gain staging</b>, and why do healthy EQ curves usually sit <i>below</i> 0 dB?",
    answer:"<b>Gain staging</b> means keeping levels sensible at every step so nothing clips and each device 'sees' a healthy signal (not too hot, not too weak). Boosting frequencies pushes level up and can drive the next device too hard, so a clean approach is to <b>cut problems first</b> and only add makeup gain where you truly need it. That's why good EQ curves are mostly cuts (below 0 dB) — you carve, rather than pile up boosts that stack into clipping.",

    links:[["Manual","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"prin", dev:"Harmonics",
    prompt:"Your instructor keeps saying Overdrive 'adds <b>harmonics</b>' to a lead. What are harmonics, in plain terms?",
    answer:"Every musical note secretly contains a stack of quieter tones <i>above</i> its main pitch — those are its <b>harmonics</b> (or overtones). That hidden stack is what makes a violin and a synth sound different even on the same note. <b>Distortion/saturation</b> devices (Overdrive, Saturator, Roar) work by <i>manufacturing more of these upper tones</i> that weren't there before. A clean sine wave is like a single voice; adding harmonics turns it into a choir singing the same note with extra edge and sparkle up top. More harmonics = brighter, richer, grittier, more 'alive' — and, crucially, more able to <b>cut through a busy mix</b>.",
    you:"This is exactly why Overdrive on your lead makes it sit on top of the track: it adds mid-high harmonics so the lead feels present and exciting without just being louder.",

    jargon:[["Harmonics / overtones","the quieter tones stacked above a note's main pitch that give it its character."],["Fundamental","the main pitch you actually perceive; the harmonics sit above it."],["Saturation / distortion","the act of adding harmonics by reshaping the waveform — from gentle warmth to full grit."]],
    links:[["Manual: Overdrive","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Saturator","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"prin", dev:"Chain vs track volume",

    answer:"Something else — they're <b>two separate gain stages</b> at different points in the signal path. <b>Chain volume</b> lives <i>inside the rack</i> and is applied early, relative to the <i>other chains</i>. The <b>track fader</b> is applied last, to the whole rack's combined output. So −16 on the delay chain means the delay is 16 dB quieter than your dry-lead chain — a <b>balance</b> between the two pathways; the −15.6 fader then lowers the entire lead (dry <i>and</i> delay together) by the same amount, without changing that balance. The delay passes through both stages, but the number that matters is the relative one.",

  { cat:"prin", dev:"Dotted eighth note",
    prompt:"What's a <b>dotted eighth note</b>, and how is it different from a regular eighth note?",
    answer:"A <b>dot</b> adds half of a note's value to it, so a <b>dotted eighth</b> lasts <b>1.5× a regular eighth</b>. In sixteenths: a regular eighth = <b>2 sixteenths</b>, a dotted eighth = <b>3 sixteenths</b>. In beats (4/4, where a quarter = 1 beat): a regular eighth = ½ beat, a dotted eighth = ¾ beat. The dot rule works on any note — a dotted quarter = 1.5 beats, and so on.",
    you:"This is the secret behind the <b>dotted-eighth delay</b> (1/8D) you'll reach for constantly: because it's 3 sixteenths, the echoes land <i>between</i> your straight notes — that syncopated, rolling, wide bounce. A straight-eighth delay lands on the same grid as your notes, reinforcing it instead of dancing around it.",
    tryThis:"On a pluck, set a delay to 1/8 vs 1/8-dotted at the same tempo. Straight sits on the grid; dotted gallops between the beats — the classic house/EDM delay feel.",
    jargon:[["Dot","adds half the note's own value — a dotted eighth = an eighth + a sixteenth."],["Sixteenth note","a quarter of a beat; a regular eighth is 2 of them, a dotted eighth is 3."],["Syncopation","landing notes off the main beats — why dotted delays feel groovy and 'off the grid.'"]],
    links:[["Manual: audio effects","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"prin", dev:"Bass Mono",
    prompt:"Why do producers force the low end to <b>mono</b> with <b>Bass Mono</b> — when they work so hard to make everything else wide?",
    answer:"Two facts about bass drive it. First, <b>you can't locate low frequencies</b> — a sub could be anywhere in the room and you'd never point to it — so making bass <i>stereo/wide</i> gains you nothing perceptually. Second, stereo bass is <b>risky</b>: if the left and right lows differ even slightly (out of phase), those long waveforms partially <b>cancel</b> when combined — in the room, on mono systems, on vinyl, in clubs — leaving a thin, weak, wobbly low end. <b>Bass Mono</b> takes everything <b>below a set frequency</b> (e.g. 120 Hz) and forces L and R to be identical (dead center), while leaving the highs wide. Result: the lows are phase-safe, all their energy stacks in the center for a solid, powerful hit, it translates the same on every system — and you keep your width up top. <b>When to break it (Guido's note):</b> match the low end to the <i>section's job</i>. In a <b>breakdown</b> or atmospheric section — often kickless and going for dreamy immersion — letting the sub/bass go <b>wide</b> is a feature, not a bug (no kick to clash with, and width <i>is</i> the emotion you want). So: mono for power (drops); wide for feeling (breakdowns).",
    you:"This is why Utility's Bass Mono (~120 Hz) sits on your bass and inside Bootsandcats: cheap insurance that the low end is centered and strong everywhere.",
    tryThis:"On a wide bass or pad, toggle Utility's full <b>Mono</b> button on/off — if the low end drops in level, you had phase cancellation hiding there. Now use <b>Bass Mono</b> instead: the lows firm up while the highs stay wide. That disappearing level drop is the point.",
    jargon:[["Bass Mono","folds everything below a set frequency to mono (centered), leaving the highs stereo."],["Phase cancellation","when left and right lows differ and partly cancel when combined — thin, weak bass."],["Mono-compatibility","still sounding right when the stereo is summed to mono (clubs, phones and vinyl often do this)."],["Match the section's job","the real rule — mono lows where power &amp; translation matter (drops); wide lows where immersion matters (breakdowns)."]],
    links:[["Manual: Utility","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: Limiter goes last",
    prompt:"In mastering, why must the <b>Limiter be the very last device</b> on your Main — never first, and with nothing (especially EQ) after it?",
    answer:"The Limiter's job is to <b>guarantee nothing exceeds the ceiling</b> and set the final loudness — so it must have the <b>last word</b> on level. Put <i>any</i> processing after it and you break that promise: an <b>EQ boost after the limiter adds gain and shoves peaks back over the ceiling</b> → clipping / inter-sample peaks, undoing exactly what the limiter just did (even a cut shifts the peaks). It also can't go <i>first</i>: if it clamps peaks before your EQ, compression and saturation, those reshape the signal and <b>re-introduce peaks</b>, wasting the limiting. The rule: <b>shape first, limit last</b> — corrective EQ → compression/glue → saturation/color → stereo, then the <b>Limiter as the final gatekeeper</b>. The <i>only</i> things safe to place after it: <b>metering / spectrum analyzers</b> (they measure, adding nothing) and a <b>Utility used <i>only</i> to cut off the volume at the very end of the song</b> — a clean ending fade/cut, <b>not</b> volume automation throughout the track. It only rides the level <i>down</i> to silence, never boosts, so it can't push past the ceiling. (Throughout-track level moves belong <i>before</i> the limiter or in the mix.)",
    you:"Guido's rule: Limiter <b>always last</b>, <b>never first</b>, <b>no EQ</b> after it. The only two things he allows after it: a <b>meter / spectrum</b> (measures only) and a <b>Utility <i>only</i> for the end-of-song cutoff</b> (not throughout-track automation). Non-negotiable ordering.",
    tryThis:"Build your master chain top-down: EQ → comp → color/width → and drop the Limiter on the very end. If you ever feel the urge to tweak <i>after</i> it, do that move <i>before</i> the limiter instead.",
    jargon:[["Chain order","devices process left-to-right; the last one has the final say on the output level."],["Inter-sample peaks","peaks hiding between the digital samples — why post-limiter gain can clip even when the meter looks under 0 (use True Peak on export)."],["Gatekeeper","the Limiter sets the final ceiling; anything placed after it can only push past that ceiling."]],
    links:[["Manual: Limiter","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: reference tracks & LUFS",
    prompt:"When you use a <b>reference track</b> to judge mastering loudness, why does the <b>source format</b> matter — and what do you do with an MP3 / YouTube rip?",
    answer:"A reference only helps if its loudness reading is <b>honest</b>. A <b>WAV (lossless)</b> file is a faithful snapshot of the real master — reference that whenever you can. An <b>MP3 or YouTube download</b> is lossy and often platform-processed, so its <b>LUFS reading isn't fully trustworthy</b> — it tends to read <i>hotter</i> than the true master. Guido's rule of thumb: if all you have is an MP3/YouTube version, <b>knock ~1.5–2 dB off its measured LUFS</b> before treating it as your target, so you're not chasing an inflated number.",
    you:"Practical: measure your reference's <b>integrated LUFS</b>; if it's an MP3/YT rip, subtract ~1.5–2 to get a fairer loudness target for your own master. Reference the WAV when you can; correct the MP3 when you can't.",
    tryThis:"Grab the WAV of a reference in your genre, measure its LUFS, and aim your master near it. Only have a YouTube MP3? Take the reading, subtract ~1.5–2 dB, and match that.",
    jargon:[["LUFS","Loudness Units Full Scale — the standard measure of <i>perceived</i> loudness (what streaming platforms target)."],["Lossless (WAV) vs lossy (MP3)","WAV keeps the full signal; MP3 throws data away and can shift the measured loudness — so WAV is the honest reference."],["Integrated LUFS","the average loudness over the whole track (vs momentary) — the number you match to."]],
    links:[["Manual: Spectrum / metering","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: EQ do's & don'ts",
    prompt:"Mastering EQ — what's the big 'don't' Guido keeps hammering about cutting the low end?",
    answer:"<b>Don't cut lows just because a visualizer <i>shows</i> energy there.</b> Mastering EQ makes <b>broad moves on the whole mix</b>, so a high-pass affects <i>everything</i> — including your foundational elements (kick, bass, a lead with some low end). That low energy the analyzer shows usually <b>is</b> your foundation, not junk; over-cutting it weakens the track and hurts how it <b>translates</b> on real systems. Use your ears, not the picture — don't high-pass 'because it looks like it's taking up space.'<br><br><b>Same caution with Mid/Side EQ.</b> Cutting the low end on the <b>Side</b> channel is a common 'tighten the lows' move — but it only works if the low end lives in the <b>Mid</b>. If the bass is intentionally <b>wide/moving</b> (e.g. a breakdown where you didn't mono it), its low energy swings between mid and side — watch it on <b>Ozone Imager</b> (positive = mid, negative = side). A low-<b>Side</b> cut then <b>chops the bass whenever it swings to the sides</b> → the bass audibly cuts in and out. So be intentional: match your M/S low cuts to whether the bass is centered or wide.<br><br><b>Keep the moves small.</b> Mastering EQ is polish, not repair, so tweaks should be gentle. If you catch yourself pushing a band — especially a <b>Mid/Side gain</b> — by <b>4 dB or more</b> on the Main, that's a red flag that the real problem is a <b>mix / production issue in the individual tracks</b>, not a mastering one. Go fix it in the mix instead of band-aiding it on the master.",
    you:"Ties straight to your Bass Mono nuance: mono-ing the lows works for a centered drop bass, but in a breakdown with a wide bass, cutting the low Side makes it pump in and out. Ears over visualizer — especially near the kick, bass, and the low end of leads.",
    tryThis:"Before any low-end cut on the master, A/B with your ears (not the analyzer). For M/S: check the bass on Ozone Imager first — if it's swinging to the sides, don't high-pass the Side or you'll gate the bass in and out.",
    jargon:[["High-pass (low cut)","removes energy below a cutoff — on a master it hits the whole mix, foundation included."],["Translation","how the master holds up across systems (car, club, phone, earbuds)."],["Mid/Side low cut","cutting lows on the Side channel — safe only if the bass low end lives in the Mid, not the sides."],["The 4 dB tell","needing ≥4 dB of EQ on the master means the fix belongs upstream in the mix — mastering EQ should stay subtle."]],
    links:[["Manual: EQ Eight","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: saturation before the limiter",
    prompt:"Adding <b>saturation before the limiter</b> on the master — why do it, and what are the Roar vs OTT gotchas?",
    answer:"A touch of saturation before the final limiter adds <b>harmonics</b> → the mix feels <b>louder, warmer, glued and denser</b>, and it gently rounds peaks so the <b>limiter works less hard</b> (more perceived loudness, less pumping). It sits <i>before</i> the limiter, never after. Two Ableton options Guido weighs:<br><br><b>Roar</b> (multiband — low/mid/high) is true saturation. Gotcha: you already run Roar on the <b>drum bus</b>, so adding it on the Main <b>saturates the drums twice</b> → likely harsh, over-cooked distortion. If you saturate the master, go gentle.<br><br><b>OTT</b> isn't really a saturator — it's <i>aggressive multiband up/down compression</i> that adds density/loudness. Its issues on a master: it's <b>heavy-handed</b> (flattens dynamics, kills punch, can fatigue), its <b>upward compression raises the noise floor</b> and pulls up low-level junk (reverb tails, hiss), and it can <b>pump and over-brighten</b> — plus it <i>exaggerates</i> whatever's already there. Use a <b>low Amount (~15–35%)</b> and bypass-compare; it's a color, not a transparent stage.<br><br><b>Order matters:</b> saturation and OTT go <b>before the compressor</b> (which itself sits before the limiter). If you compress first and <i>then</i> start moving things around with OTT/saturation, you undo the dynamics you just set — a complete mess. Flow: <b>corrective EQ → saturation / OTT (harmonics & density) → compressor → limiter.</b>",
    you:"Ties to your <b>Harmonics</b> card (saturation = manufactured harmonics = loudness/warmth) and the 'clean before you enhance' tools insight (OTT amplifies problems). Your drum-bus Roar is exactly why a second Roar on the Main risks double-saturation.",
    tryThis:"If you try OTT on the master, start Amount ~20–30% and bypass-compare — listen for 'bigger/denser' without 'flat/harsh/noisy.' For Roar, keep the drive low so you're not double-saturating the drums.",
    jargon:[["Saturation before the limiter","gentle harmonics that add loudness/glue and round peaks so the limiter works less."],["OTT on a master","aggressive multiband compression — adds density but flattens dynamics, lifts noise, over-brightens if pushed."],["Double-saturation","saturating something already saturated (drum-bus Roar + master Roar) → harshness."],["Order: shape before compress","saturation/OTT go before the compressor; compressing first then reshaping undoes the dynamics."]],
    links:[["Manual: Roar","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Multiband Dynamics (OTT)","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: Glue Compressor on the master",
    prompt:"<b>Glue Compressor on the master</b> — why is Guido wary of it, and how would he set it up if you <i>have</i> to?",
    answer:"On the master, a Glue Compressor gets triggered by the <b>loudest hits (usually the kick)</b> — each kick shoves the mix over the threshold, the comp clamps, and the <b>whole mix dips</b> for a moment. The <b>Release (~0.1 s)</b> sets how long that dip lasts before it recovers, so you get a <b>short dip/pump after every kick</b>. Guido's caution: those dips are only worth it if you <i>want</i> that pumping glue. If your kick and elements are <b>already properly compressed in the mix</b>, master glue just adds <b>unnecessary dips</b> — pumping the whole master for no benefit (and costing punch).<br><br><b>If you must:</b> keep it gentle, and the key control is <b>Range</b> (here 2.36 dB) — it <b>caps the maximum gain reduction</b>, so the comp can only ever pull down ~2.4 dB and the dips stay tiny. Plus <b>Soft Clip on</b> (tames peaks), Ratio ~4:1, threshold set for only 2–3 dB of GR.",
    you:"The recurring theme: <b>fix it in the mix first</b> — master glue is optional polish, not a place to fix dynamics. The <b>Range</b> knob is the safety valve: it's how you get subtle glue without the whole track pumping on every kick.",
    tryThis:"If you add Glue to the master: set <b>Range</b> low (~2–3 dB) so it can't over-compress, Soft Clip on, and dial threshold for only 2–3 dB of GR. If the needle dives hard on every kick, your <i>mix</i> needs the fix, not the master.",
    jargon:[["Range (Glue)","caps how much gain reduction the Glue Compressor can do — the safety valve for gentle master glue."],["Pumping / dips","the whole mix dropping in level on each loud hit (kick), then recovering over the release."],["Soft Clip","gently clips loud peaks (a little color); caps output around −0.5 dB."]],
    links:[["Manual: Glue Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: inter-sample peaks (True Peak)",
    prompt:"What are <b>inter-sample peaks</b>, and how does Ableton deal with them?",
    answer:"Digital audio is a stream of discrete <b>samples</b> (snapshots of the waveform), and your peak meter reads the level <i>at</i> those sample points. But when the signal is converted back to analog (your DAC) or encoded to a lossy format (MP3/AAC), the smooth waveform is <b>reconstructed between the samples</b> — and that curve can <b>peak higher between two samples than either sample itself</b>. That hidden overshoot is an <b>inter-sample peak</b>. So your meter can read −0.1 dB (looks safe) while the actual output pushes <b>over 0 dBFS between samples → clipping/distortion</b>, even though the digital meter never showed it. That's why a master slammed to exactly 0 dB can still distort on playback.<br><br><b>In the manual:</b> Ableton only mentions them in the <b>Limiter's Ceiling mode</b> — <b>True Peak</b> mode 'prevents inter-sample peaks.' It gives you the tool, not the concept.",
    you:"This is the 'why' behind the True Peak note on your Limiter cards: set the master Limiter to <b>True Peak</b> and leave headroom — ceiling around <b>−1.0 dB</b> (or −0.3) — especially for <b>streaming</b>, which re-encodes to lossy and reveals these overshoots.",
    tryThis:"On your master Limiter, switch Ceiling mode to <b>True Peak</b> and set the ceiling to −1.0 dB. Now the meter reading and the real (true-peak) output agree — no surprise clipping after conversion or streaming.",
    jargon:[["Sample","one snapshot of the waveform's level; digital audio is a stream of them, and meters read the sample values."],["Inter-sample peak","an overshoot in the reconstructed waveform that sits <i>between</i> samples — invisible to a normal peak meter."],["True Peak (dBTP)","a mode/measurement that accounts for those between-sample overshoots; the Limiter's True Peak mode catches them."]],
    links:[["Manual: Limiter","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"master", dev:"Mastering: dithering (& export options)",
    prompt:"What is <b>dithering</b>, and which Ableton export dither option do you pick?",
    answer:"Live works internally in <b>32-bit float</b>; you export a finished master to <b>16-bit</b> (streaming/CD). Dropping bit depth <b>rounds every sample to fewer values</b> → <b>quantization error</b>, a gritty distortion worst in quiet parts and fade tails. <b>Dithering adds a tiny bit of random noise <i>before</i> the reduction</b>, scrambling that error into a quiet, benign noise floor instead of distortion. Two iron rules: only when <b>reducing bit depth</b> (skip it if you export 32-bit), and <b>only once ever</b> per file (never re-dither) — so if any processing follows, render 32-bit and don't dither yet.<br><br><b>Ableton's Dither Options dropdown:</b> <b>No Dither</b> (none — for 32-bit, or if you'll process/dither later); <b>Rectangular</b> (least noise, a bit more quantization error); <b>Triangular</b> (the <b>default/safest</b>, best if any further processing is possible); <b>POW-r 1/2/3</b> (progressively stronger, noise <b>shaped above the audible range</b> — for the <b>final master</b> with nothing after).",
    you:"For your final 16-bit master (nothing after it): <b>POW-r</b> (noise pushed out of hearing) or the safe <b>Triangular</b>. Doing more work after, or exporting 32-bit: <b>No Dither</b>. It's the very last step, paired with True-Peak limiting.",
    tryThis:"Exporting the finished master to 16-bit WAV for streaming? Bit Depth 16, dither <b>POW-r 2</b> (or Triangular to play safe). Exporting a 32-bit stem to keep working on? <b>No Dither</b>.",
    jargon:[["Dithering","tiny random noise added before a bit-depth reduction to hide quantization distortion."],["Quantization error","rounding distortion from fewer bit values — worst in quiet passages / fades."],["Bit depth","how many level values per sample (16-bit for streaming; 32-bit float internally)."],["POW-r vs Triangular","POW-r shapes the dither noise out of the audible range (final master); Triangular is the safe all-rounder."]],
    links:[["Manual: dithering & export","https://www.ableton.com/en/manual/managing-files-and-sets/"]] },

  { cat:"prin", dev:"Sample rate",
    prompt:"What is <b>sample rate</b>, and why are 44.1 / 48 kHz the standard?",
    answer:"Digital audio is a <b>scatter of dots</b> — the sample rate is <b>how many of those dots (samples) you take per second</b>. 44.1 kHz = 44,100 snapshots of the waveform every second. More dots = finer time detail and higher frequencies captured. The catch (<b>Nyquist</b>): the highest frequency you can represent is <b>half the sample rate</b> — so 44.1 kHz reaches ~22 kHz, which safely covers human hearing (~20 kHz). That's why <b>44.1 kHz</b> (CD/streaming) and <b>48 kHz</b> (video) are the standards. Higher rates like 88.2/96 kHz give extra headroom for processing, but bigger files and more CPU for no audible frequency gain.",
    you:"This is the baseline your whole project runs at. It's what <b>oversampling</b> temporarily multiplies, and the reason <b>inter-sample peaks</b> exist (overshoots hide <i>between</i> the dots).",
    tryThis:"Work at 44.1 or 48 kHz for electronic music — it's plenty. Higher rates won't make your synths sound 'better,' just heavier; reserve them for tracking/processing headroom.",
    jargon:[["Sample rate","how many samples (waveform snapshots) per second — 44.1 kHz = 44,100/sec."],["Nyquist","the highest frequency representable = half the sample rate (44.1 kHz → ~22 kHz)."],["Why 44.1/48 kHz","they cover the full range of human hearing (~20 kHz) with a little margin."]],
    links:[["Ableton Live manual","https://www.ableton.com/en/manual/"]] },

  { cat:"prin", dev:"Oversampling",
    prompt:"What is <b>oversampling</b> (4× vs 12×), and when does it matter?",
    answer:"Oversampling temporarily runs a device's internal processing at a <b>multiple of the sample rate</b> — <b>more dots</b> for hyper-detail — then converts back down at the output. <b>4×</b> = 4 times the internal resolution, <b>12×</b> = 12 times (one setting, not N passes). Two payoffs: (1) <b>cleaner nonlinear processing</b> — saturation/distortion/limiting create harmonics above <b>Nyquist</b> that would fold back as ugly <b>aliasing</b>; oversampling gives them room, then filters them off → cleaner. (2) <b>accurate true-peak detection</b> — reconstructing the between-sample peaks <i>requires</i> oversampling, so <b>12× reveals a more precise (often slightly higher) true peak than 4×</b>. Higher = cleaner + more accurate, but more CPU, with diminishing returns past 4×.",
    you:"You'll meet it as the <b>Oversampling</b> toggle on your Glue Compressor and Saturator, and inside the Limiter's <b>True Peak</b> mode. Same 'more dots' idea as your inter-sample-peaks card — applied temporarily.",
    tryThis:"Turn oversampling on when you're saturating or clipping hard (hear the fizz/aliasing clean up). For the master, use a true-peak limiter — its oversampling is what makes the true-peak reading honest.",
    jargon:[["Oversampling","temporarily processing at a multiple (4×, 12×) of the sample rate, then downsampling back."],["Aliasing","new harmonics above Nyquist folding back into the audible range as inharmonic junk — oversampling prevents it."],["4× vs 12×","higher = cleaner + more accurate true peak, more CPU; diminishing returns past 4×."]],
    links:[["Manual: Glue Compressor / Saturator","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  // ===== DYNAMICS =====
  { cat:"dyn", dev:"Compressor",
    prompt:"When do you reach for the plain <b>Compressor</b> instead of the Glue Compressor?",
    answer:"The <b>Compressor</b> is Live's surgical, do-anything dynamics tool — use it to control a <i>single</i> element. It has an adjustable <b>knee</b>, <b>Peak vs RMS</b> detection (fast transient-catching vs smooth loudness-riding), a full <b>sidechain</b> with its own EQ, and Dry/Wet for parallel compression. Reach for it to tame a vocal, tighten a bass, tuck a snare, or set up kick-triggered ducking. (Gluing a whole group is the Glue's job.)",
    you:"You have Compressors on the bass, synth pluck, main pad (sidechained), vocals and several FX — several later bypassed as Guido rebuilds the dynamics in Part 2.",
    tryThis:"On the vocal: slow-ish attack to keep consonants, ratio ~3:1, threshold for 3–5 dB reduction, then makeup to match. It should sit steadier, not quieter.",
    jargon:[["Knee","how gradually compression engages around the threshold (soft = smooth, hard = aggressive)."],["Peak vs RMS","reacting to fast spikes vs to average loudness."],["Sidechain EQ","filtering what the compressor 'listens' to, so it reacts to specific frequencies."]],
    links:[["Manual: Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dyn", dev:"Glue Compressor",
    prompt:"You want your whole <b>drum bus</b> to feel like one glued unit. Why is the <b>Glue Compressor</b> right, and where does it go?",
    answer:"The <b>Glue Compressor</b> is an analog-modeled bus compressor (built with Cytomic, based on a classic 80s SSL console). It's made to sit on a <b>Group or Main</b> track and fuse multiple sources into one cohesive, slightly-colored whole. Unlike the regular Compressor it has <b>no adjustable knee</b> (the knee sharpens as ratio rises), plus a <b>Range</b> limit, <b>Soft Clip</b> for taming peaks, and <b>Dry/Wet</b> for parallel glue. Rule of thumb: Compressor = control one thing; Glue = make many things feel like one.",
    you:"You already did this right — Glue sits on your drum group (and another on the bass with a sidechain filter).",
    tryThis:"Drum-group Glue: Ratio 2:1, Attack 10 ms, Release Auto, threshold for ~2–4 dB reduction. Bypass on/off — listen for 'tighter,' not 'quieter.'",
    jargon:[["Bus / group","a channel several tracks feed into so you can process them together — a 'drum bus' is all drums on one channel."],["Glue","making separate sounds feel like one cohesive unit."],["Soft Clip","gentle clipping that tames loud peaks and adds a little color."]],
    links:[["Manual: Glue Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=7xEZa1IlW5Q"]] },

  { cat:"dyn", dev:"Glue Compressor — Attack & Release",
    prompt:"On the <b>Glue Compressor</b>, why do Attack and Release feel so different — and when should you use <b>Auto</b> release?",
    answer:"Watch the units: on the Glue, <b>Attack is in milliseconds</b> and <b>Release is in seconds</b> (easy to mix up). <b>Attack</b> (as fast as 0.01 ms) sets how quickly it clamps once a signal crosses the threshold — a fast attack tames the initial <b>peak</b> of each hit. <b>Release</b> (stepped 0.1 → 2 s, then <b>A</b>) sets how fast it stops compressing after the signal drops back down — fast = punchy and recovers between hits, slow = smoother and holds longer. <b>Auto (A)</b> lets the Glue vary the release to match the material, usually the smoothest, safest default on a bus.",
    you:"Your delay-chain Glue runs Ratio 4:1, Attack 0.01 ms, fast release — fast attack tames each echo's peak, fast release lets the tail breathe. Heads-up: fast attack + fast release on your ~515 Hz low-passed delay can distort or pump; if it sounds gritty, slow the attack a touch, lengthen release, or switch to Auto.",
    tryThis:"Solo the delay chain and watch the gain-reduction needle: Attack 0.01 slams it down on each repeat's front; fast release snaps it back between repeats. A/B against Release = Auto to hear which rides smoother.",
    jargon:[["Attack (ms)","how fast the compressor clamps after crossing the threshold — it grabs the peak."],["Release (s)","how fast it stops compressing after the signal drops — fast = punchy, slow = smooth."],["Auto release","the compressor sets and varies the release time itself, based on the audio."]],
    links:[["Manual: Glue Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=7xEZa1IlW5Q"]] },

  { cat:"dyn", dev:"Multiband Dynamics (OTT)",
    prompt:"<b>OTT</b> makes synths instantly bigger. It's a preset of <b>Multiband Dynamics</b> — so what's it doing that a normal compressor doesn't?",
    answer:"A normal compressor does <b>downward compression</b> — it turns <i>loud</i> parts down. <b>Multiband Dynamics</b> (where <b>OTT</b> lives) also does <b>upward compression</b> — it turns <i>quiet</i> parts <i>up</i> — and it does both across <b>three separate frequency bands</b> at once (split by <b>crossovers</b>). OTT cranks both directions hard on lows, mids and highs, so quiet detail gets lifted and loud peaks pulled down, per band — which is why synths sound huge, bright and in-your-face. Easy to overdo.",
    you:"You ran OTT on the <b>bass and synth pluck</b> (later bypassed on the bass in Part 2). At 100% it flattens aggressively.",
    tryThis:"Instead of 100% OTT, pull the <b>Amount</b> to ~25–35% — you keep the polish without the lifeless, pumping flatten.",
    jargon:[["Downward vs upward compression","downward turns loud parts down; upward turns quiet parts up. Both shrink the gap between loud and soft, making a sound denser and 'bigger.'"],["Band","a frequency range (low / mid / high) processed on its own."],["Crossover","the frequency where the device splits one band from the next."]],
    links:[["Manual: Multiband Dynamics","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dyn", dev:"Drum Buss",
    prompt:"Your kit sounds thin and messy, so you reach for <b>Drum Buss</b>. What four jobs is it doing at once — and which knob adds punch?",
    answer:"<b>Drum Buss</b> is a one-stop drum processor that bundles four jobs into a single device. (1) A built-in <b>Comp</b> — a fixed compressor that 'glues' the drums into one kit. (2) <b>Distortion</b> in three flavors: <i>Soft</i> gently rounds the loud peaks for warmth, <i>Medium</i> clamps them harder for grit, <i>Hard</i> chops them flat and adds low-end for the most aggressive tone. (3) <b>Transients</b> — up to exaggerate the initial 'crack' of each hit (punch), down to tighten and de-rattle. (4) Low-end shaping — <b>Boom</b> adds a tuned sub-bass resonance to fatten the kick, while <b>Crunch</b> adds bite to the mid-highs and <b>Damp</b> tames the harshness that creates. The <b>Transients</b> knob is your punch control.",
    you:"This is the device on your <b>Kick 1</b> — now you can see why it changed so much at once.",
    tryThis:"Solo the kick. Push <b>Transients</b> to +30% (hear the click sharpen), add a little <b>Boom</b> (hear it fatten), then A/B the <b>Comp</b> toggle. One control at a time.",
    jargon:[["Transient","the split-second spike at the very start of a hit — before the body. It's what makes a drum feel punchy."],["Glue","when a compressor makes separate sounds move together as one unit."],["Waveshaping (soft/medium/hard)","reshaping the waveform to add harmonics — 'soft' rounds peaks gently, 'hard' chops them flat for grit."]],
    links:[["Manual: Drum Buss","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=_okKGKp5a9I"]] },

  { cat:"dyn", dev:"Limiter",
    prompt:"It's the last device on your master. Why is a <b>Limiter</b> called a 'brickwall,' and which mode do you pick for the final export?",
    answer:"A <b>Limiter</b> is a compressor turned up to the extreme — an <b>infinite ratio</b>, meaning it acts like a hard wall: no matter how loud the incoming signal pushes, the output can't cross the <b>Ceiling</b> you set. That's the 'brickwall.' Its job on the master is to raise overall loudness while guaranteeing nothing clips. Pick the ceiling mode by purpose: <i>Standard</i> for transparent limiting, <i>Soft Clip</i> to add a touch of color/punch near the ceiling, and <b>True Peak</b> for the final export — it prevents peaks that hide <i>between</i> the digital samples and would otherwise distort after streaming or conversion.",
    you:"This is exactly where Guido's mastering stage lands — last on your <b>Main</b> track, after mastering EQ and compression.",
    tryThis:"Ceiling −1.0 dB, <b>True Peak</b> on, then raise <b>Input Gain</b> until it's loud but the kick keeps its snap. A few dB of gain reduction is plenty.",
    jargon:[["Infinite ratio (∞:1)","'ratio' is how hard a compressor pushes loud parts down. Infinite = a hard ceiling; nothing gets past it — like your head hitting a low ceiling no matter how high you jump."],["Ceiling","the maximum output level you allow — the wall the sound can't cross."],["True Peak / inter-sample peak","a peak that appears between the digital sample points; True Peak mode catches it so your track doesn't distort after conversion or streaming."]],
    links:[["Manual: Limiter","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=Gvbf90IffRo"]] },

  { cat:"dyn", dev:"Compressor vs Limiter (+ what Ratio does)",
    prompt:"How is a <b>Limiter</b> different from a <b>Compressor</b> — and what does the <b>Ratio</b> knob actually control?",
    answer:"A limiter <i>is</i> a compressor — just pushed to its extreme, and the knob that separates them is <b>Ratio</b>. Ratio sets <b>how hard</b> the signal is turned down once it crosses the <b>Threshold</b>: at <b>4:1</b>, a signal 4 dB over comes out only 1 dB over — gentle, so the loud parts still poke through. A <b>compressor</b> uses these moderate ratios to <i>shape</i> dynamics (control a vocal, glue a bus, add punch). A <b>limiter</b> uses an <b>infinite ratio (∞:1)</b> — a <b>brickwall</b> — so <i>nothing</i> gets past the ceiling no matter how hard it's hit; it doesn't shape, it <b>caps</b>. Governor vs wall: a compressor eases the loud parts back (you can still creep over the line); a limiter is a hard cap you can't cross.",
    you:"So: <b>Compressor = shape &amp; glue</b> — a musical tone tool you often want to hear, used anywhere in the chain. <b>Limiter = protect &amp; maximize</b> — a safety ceiling + loudness tool, ideally invisible, almost always last on the Main. It's why Guido could use a limiter creatively on your delay tail: it's just a compressor smashing the echoes against a ceiling.",
    tryThis:"On one sound, set a compressor to 4:1 — 'controlled but alive.' Then push the ratio toward ∞:1 (or swap in a Limiter) at the same threshold — hear it flatten hard against a ceiling. Same machine, opposite intent.",
    jargon:[["Ratio","how hard the signal is reduced above the threshold — 4:1 means 4 dB in over becomes 1 dB out."],["Limiting (∞:1)","ratio taken to its extreme — a brickwall the signal can't cross."],["Compressor vs Limiter","compressor shapes dynamics (moderate ratio, you hear it); limiter caps peaks &amp; lifts loudness (∞ ratio, ideally invisible)."]],
    links:[["Manual: Compressor","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Manual: Limiter","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  // ===== EQ & FILTER =====
  { cat:"eq", dev:"EQ Eight",
    prompt:"<b>EQ Eight</b> is your most-used device. What are its three <b>modes</b> — Stereo, L/R, M/S — and why run two EQ Eights on one track?",
    answer:"<b>EQ Eight</b> gives you up to eight parametric bands to reshape tone. Its <b>modes</b> change what the curve acts on: <b>Stereo</b> (one curve on both channels), <b>L/R</b> (separate left and right curves), and <b>M/S</b> (separate curves for the center and the width). Why two on one track? Different jobs: the <b>first = corrective</b> (cut rumble, boxiness, harshness) placed <i>before</i> compression so the compressor isn't reacting to junk; the <b>second = tonal</b> (air, presence) placed after. Fix first, flavor last — try naming them 'CUT' and 'TONE.'",
    you:"EQ Eight is on nearly everything; on the drum group you used M/S, and you stack two EQs on the main pad and others.",
    tryThis:"Rename your first EQ 'CUT' (all high-passing and notching here) and the second 'TONE' (only boosts). Your chains instantly make sense.",
    jargon:[["Parametric band","an EQ point where you choose the frequency, how much to boost/cut, and how wide (Q)."],["M/S mode","editing the center (Mid) and width (Side) with separate curves."],["Corrective vs tonal EQ","cutting problems early vs shaping character late."]],
    links:[["Manual: EQ Eight","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"eq", dev:"Auto Filter",
    prompt:"A plain filter stays put. What makes <b>Auto Filter</b> different — and what does its <b>envelope follower</b> do?",
    answer:"<b>Auto Filter</b> is a filter that can <i>move its own cutoff</i> — that's the 'auto.' It moves two ways: an <b>LFO</b> sweeps the cutoff rhythmically, and an <b>envelope follower</b> makes the cutoff react to how loud the signal is (or to an external sidechain) — so the filter opens on loud hits and closes on quiet ones. Add <b>Resonance</b> for a whistle at the cutoff, and <b>Drive</b> to distort as it filters. 'Legacy' is just the older filter model kept for compatibility with imported course files.",
    you:"Your Kick 1 has a grouped pair of automated Auto Filters, and you carried in 'Auto Filter Legacy' twice from the course project files.",
    tryThis:"On a riser, automate the <b>cutoff</b> from ~200 Hz up to 18 kHz over 8 bars with a bit of <b>resonance</b>. Tension → release into the drop.",
    jargon:[["Cutoff","the frequency where the filter starts removing sound; sweeping it is the classic 'opening up' move."],["Resonance","a boost/whistle right at the cutoff that emphasizes it."],["Envelope follower","makes a control react to the signal's loudness — here, louder = filter opens more. Like a light that brightens the harder you clap."]],
    links:[["Manual: Auto Filter","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=7CHuX_V0pD0"]] },

  { cat:"eq", dev:"Utility",
    prompt:"You want your <b>sub centered</b> but your <b>highs wide</b>. Which <b>Utility</b> features get you there — and what else is this little device for?",
    answer:"<b>Utility</b> is your level/stereo Swiss-army knife — its whole job is managing <b>level and stereo without changing tone</b> ('how loud' and 'how wide / where'). For your goal: <b>Bass Mono</b> folds the lows below a set point to mono (solid, phase-safe bottom) while <b>Width</b> (or Mid/Side mode) keeps the highs spread. It also does <b>Gain</b> (great for automating fades without touching the fader), <b>Balance</b> (pan), <b>Mono</b> (a mix-check collapse), <b>Mute</b> (placed mid-chain, it can cut the feed into a reverb without killing its tail), and <b>DC</b> (removes sub-audible offset before nonlinear effects).",
    you:"You leaned on Utility a lot — often automating its Gain, and in the bass 'Shaper + 2 Utilities' pseudo-sidechain.",
    tryThis:"On the bass, turn on Bass Mono (~120 Hz). Kick and bass stop fighting for the center — the low end gets noticeably more solid.",
    jargon:[["L/R vs Mid/Side","L/R = the two literal speaker channels (a repair lens); Mid/Side = center (shared) vs width (differences) — the mix lens you'll usually want."],["Mono vs Bass Mono","Mono collapses the <i>whole</i> signal to center (usually a mono-check); Bass Mono collapses only the <i>lows</i>, keeping the highs wide (a permanent low-end move)."],["Phase (Ø)","flips a channel's polarity — a repair tool that fixes cancellation when a sound goes thin or weak (especially in mono)."],["Width","how far the signal spreads in stereo (0% = mono, &gt;100% = wider)."],["Bass Mono","folds the lows to mono for a stronger, phase-safe low end."]],
    links:[["Manual: Utility","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  // ===== DISTORTION & CHARACTER =====
  { cat:"dist", dev:"Roar — routing",
    prompt:"<b>Roar</b> has a <b>Routing</b> menu — Single, Serial, Parallel, Multi Band, Mid Side, Feedback. What's the big idea, and what does <b>Multi Band</b> do?",
    answer:"<b>Roar</b> is a dynamic saturation device, and its <b>Routing</b> mode decides the <i>structure</i> of how the signal is distorted. <b>Single</b> = one saturation stage. <b>Serial</b> = two stages in a row (stacked grit). <b>Parallel</b> = two independent stages you blend between. <b>Multi Band</b> splits the sound into <b>Low / Mid / High</b> (set by two <b>crossover</b> filters) so you can saturate each band on its own — perfect for drums and full mixes, since you can add grit to the mids without frying the bass. <b>Mid Side</b> saturates center vs width separately; <b>Feedback</b> re-feeds the output for resonant, wild tones.",
    you:"You ran Roar in <b>Multi Band</b> on your drum group (Low/Mid/High) — band-by-band saturation adds density where you dial it.",
    tryThis:"On the drum bus, Multi Band Roar: add a little saturation to the <i>Mid</i> band only, leaving the Low clean. Grit without losing sub.",
    jargon:[["Saturation","gentle distortion that adds harmonic warmth and perceived loudness."],["Routing mode","the structural path the signal takes through the device's stages."],["Crossover","the frequency where the sound is split into separate bands."]],
    links:[["Manual: Roar","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=ETzf6O9-6us"]] },

  { cat:"dist", dev:"Roar — shaper",
    prompt:"Inside <b>Roar</b>, each gain stage has <b>Shaper Amount</b>, <b>Shaper Bias</b>, a <b>Shaper Type</b> dropdown and a filter. What do Amount and Bias each do?",
    answer:"The <b>Shaper</b> is the actual distortion curve. <b>Shaper Amount</b> sets <i>how much</i> saturation — how hard the signal is pushed into the non-linear parts of the curve (more = more distortion). <b>Shaper Bias</b> <i>offsets</i> the signal to create <b>asymmetrical</b> distortion; moderate settings sound like a 'broken circuit,' extreme settings can make it drop out to quiet. The <b>Shaper Type</b> dropdown picks the flavor of curve (12 options, from <i>Soft Sine</i>'s smooth warmth to harder, noisier, fractal curves), and a per-stage <b>filter</b> can sit before or after the shaper.",
    you:"In your Multi Band Roar, each of the Low/Mid/High bands has its own Amount/Bias/type — that's a lot of the 'grit' character on your drums.",
    tryThis:"Pick Soft Sine, raise Amount for warmth, then slowly add Bias — hear it move from clean to gritty and asymmetrical.",
    jargon:[["Shaper Amount","how much saturation is applied (intensity)."],["Shaper Bias","an offset that makes the distortion asymmetrical — adds 'broken/character' grit."],["Shaper Type","the shape of the distortion curve — sets the flavor from smooth to harsh."]],
    links:[["Manual: Roar","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dist", dev:"Overdrive",
    prompt:"Your bass is clean but boring, so you try <b>Overdrive</b>. What do <b>Drive</b>, the <b>X-Y band</b>, and <b>Tone</b> each do?",
    answer:"<b>Overdrive</b> is a distortion effect modeled on classic guitar pedals — it adds grit and <b>harmonics</b>. The <b>X-Y pad</b> is a <b>band-pass filter</b> placed <i>before</i> the distortion: drag horizontally to choose <i>which</i> frequencies get distorted, vertically to set how wide that band is. <b>Drive</b> sets how much distortion (note: even 0% isn't fully clean). <b>Tone</b> is a post-distortion brightness control — higher = more highs. <b>Dynamics</b> controls how much it compresses as you drive harder.",
    you:"Overdrive sits on your bass, synth pluck and lead — you flagged it as unfamiliar. The X-Y band is the trick: park it on the mids for a focused growl.",
    tryThis:"On the bass: set the X-Y band over the mids, raise <b>Drive</b> slowly. Hear the 'growl' appear in just that zone. Back <b>Tone</b> off if it gets fizzy.",
    jargon:[["Band-pass filter","a filter that only lets a band of frequencies through (cutting above and below) — so you distort just that zone."],["Drive","how hard you push the signal into distortion."],["Harmonics","new related frequencies distortion adds on top — what makes a sound richer or grittier."]],
    links:[["Manual: Overdrive","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dist", dev:"Vocoder",
    prompt:"You put a <b>Vocoder</b> on the snare to 'lift the mids.' What is it actually doing — and what are the <b>carrier</b> and <b>modulator</b>?",
    answer:"A <b>Vocoder</b> stamps the <i>rhythmic, spectral shape</i> of one sound onto another. The <b>modulator</b> is the sound whose movement you want to copy (a voice, drums); the <b>carrier</b> is the sound you actually hear (a synth/pad). It splits both into many frequency <b>bands</b> and uses the modulator's energy in each band to control the carrier's volume in that band — the classic 'talking synth/robot voice.' It <i>felt</i> like a mid-boost on your snare because speech and percussion energy pile up in the mids, so that's where the movement landed.",
    you:"On your snare, the Vocoder was imposing mid-focused spectral energy — that's why it read as a mid lift.",
    tryThis:"Load Vocoder on a drum loop (modulator), set the carrier to a sustained pad. The pad now pulses with the drums' shape — instant rhythmic texture.",
    jargon:[["Carrier","the sound you actually hear — usually a rich synth or pad."],["Modulator","the sound whose rhythm/shape gets stamped onto the carrier (a voice, drums)."],["Band","one slice of the frequency range; vocoders match energy band-by-band between the two sounds."]],
    links:[["Manual: Vocoder","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dist", dev:"Saturator",
    prompt:"You want clean <b>warmth</b> on a synth without obvious distortion. Why <b>Saturator</b>, and what's its clever <b>Color</b> trick?",
    answer:"<b>Saturator</b> is a <b>waveshaping</b> effect that adds warmth, punch or dirt by gently reshaping the waveform — from subtle analog color to full distortion. <b>Drive</b> pushes the signal harder into the shaping curve (more harmonics); the <b>Curve Type</b> dropdown picks the flavor (Analog Clip is smooth, Digital Clip is hard, Soft Sine is warm, etc.). Its <b>Color</b> trick uses two linked filters — an EQ applied <i>before</i> the shaper and inverted <i>after</i> it — so you can, say, pull the bass out before saturating: only the mids/highs get dirty while the low end stays clean and full.",
    you:"Guido introduced Saturator in Part 2 — it's the controlled cousin of your Overdrive and Roar, best for clean warmth and glue.",
    tryThis:"On a synth: Analog Clip, raise Drive a little, then enable Color and cut the lows pre-shaper. Warmth and harmonics up top, sub still tight.",
    jargon:[["Waveshaping","reshaping the waveform to add harmonics — the mechanism behind saturation/distortion."],["Drive","how hard the signal is pushed into the shaping curve."],["Color (filter trick)","EQ before the shaper, undone after — lets you choose which frequencies get saturated."]],
    links:[["Manual: Saturator","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"dist", dev:"Redux",
    prompt:"You want that <b>lo-fi / 8-bit / crushed</b> digital grit. What is <b>Redux</b> doing to get it?",
    answer:"<b>Redux</b> is a lo-fi degradation effect built from two digital tricks. <b>Downsampling</b> (the <b>Rate</b> knob) lowers the <b>sample rate</b> — it throws away <i>time</i> resolution, adding gritty inharmonic <b>aliasing</b> tones (lower = harsher, more 'digital'). <b>Bit reduction</b> (the quantizer / <b>Bit</b> depth) throws away <i>volume</i> resolution — the classic <b>bitcrush</b> that turns smooth sounds into crunchy, steppy 8-bit grit, with a <b>Shape</b> curve from subtle to drastic. Extras: <b>Jitter</b> adds noise/randomness to the downsampler (noisier, wider), and <b>Pre/Post filters</b> tame or shape the artifacts. Range: warm 8-bit fatness → harsh digital destruction.",
    you:"A new toy you're experimenting with — great for adding edge/character to a clean sound or trashing a loop into lo-fi texture. It's the <i>digital</i> dirt counterpart to your Overdrive / Saturator / Roar (which are <i>analog</i> dirt).",
    tryThis:"On a synth or drum loop: pull <b>Rate</b> down for aliasing grit, then drop <b>Bit</b> depth for crunch. Add a <b>Post</b> low-pass to soften the harsh top and a little <b>Jitter</b> for width. A touch = character; a lot = destruction.",
    jargon:[["Downsampling (Rate)","lowering the sample rate — throws away time detail, adds gritty aliased tones."],["Bit reduction (bitcrush)","lowering bit depth — throws away volume detail, giving steppy '8-bit' crunch."],["Jitter","noise added to the downsampler's clock — noisier, wider, more unstable."]],
    links:[["Manual: Redux","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=71A5FC272L0"]] },

  // ===== TIME-BASED =====
  { cat:"time", dev:"Delay",
    prompt:"What does the plain <b>Delay</b> device do, and how do <b>sync</b>, <b>feedback</b> and its <b>filter</b> shape the repeats?",
    answer:"<b>Delay</b> is a clean digital delay with two channels. Each side's time can be set in <b>beat divisions</b> (Sync on) or milliseconds (Sync off). <b>Feedback</b> sets how many repeats you get (more = longer trail). Its built-in <b>filter</b> sits in the feedback path, so each repeat gets a little darker/thinner and the echoes don't clutter the mix. It also has <b>Ping Pong</b> (bounce L↔R), a subtle <b>modulation</b> for analog-ish wobble, and <b>Freeze</b> to hold and loop the current buffer.",
    you:"Delay is across your bass, synth pluck (L3/R6, dry/wet 17%, fb 30%), pad, lead and vocals — short offsets widen, feedback adds a trail.",
    tryThis:"On a pluck: sync 1/8-dotted, feedback ~30%, then dial the delay's filter down so repeats sit behind the dry note instead of on top.",
    jargon:[["Beat division","delay time locked to the tempo (1/8, 1/16…) instead of milliseconds."],["Feedback","how many times the echo repeats."],["Ping Pong","repeats that bounce between left and right."]],
    links:[["Manual: audio effects","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=Ss5yOq8nQK4"]] },

  { cat:"time", dev:"Echo",
    prompt:"When do you use <b>Echo</b> instead of Delay, and what's in its <b>Character</b> tab?",
    answer:"<b>Echo</b> is the characterful cousin of Delay — a modulation delay with two independent lines plus vintage flavor. Same core (Left/Right times, <b>Sync</b> with Notes/Triplet/Dotted/16th, Feedback, Ping Pong/Mid-Side), but it adds a <b>Character</b> tab: <b>Gate</b> (mute quiet repeats), <b>Ducking</b> (pull the echoes down while you're playing so they bloom in the gaps), <b>Noise</b> (vintage hiss) and <b>Wobble</b> (irregular tape-style time drift). Reach for Echo when you want the delay to feel analog, animated and out of the way of the dry signal.",
    you:"You used Echo on the <b>lead vocals</b> — double sync (L 1/8, R 1/4), dry/wet 30%, decay 50%, stereo — a bouncing rhythmic tail that ducks under the vocal.",
    tryThis:"On a vocal throw: turn on <b>Ducking</b> so the echo stays quiet while singing and blooms in the pauses. Bypass to hear how much space it added.",
    jargon:[["Modulation delay","a delay that can subtly move its time for movement / character."],["Ducking","lowering the wet signal while there's input, so echoes fill the gaps."],["Wobble","tape-style irregular time drift for vintage feel."]],
    links:[["Manual: Echo","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=inMwdangbA0"]] },

  { cat:"time", dev:"Reverb",
    prompt:"You add <b>Reverb</b> to a dry vocal. What do <b>Predelay</b>, <b>Size</b> and <b>Decay</b> each control?",
    answer:"<b>Reverb</b> simulates a physical space — the wash of reflections that follows a sound. <b>Predelay</b> is the tiny gap (in ms) before the first echo arrives; a longer predelay keeps the dry vocal clear up front and makes the room feel bigger. <b>Size</b> is the room's volume — large sounds spacious and diffuse, very small sounds tight and metallic. <b>Decay</b> is how long the tail takes to fade (how long the space 'rings'). The <b>early reflections</b> are the first distinct bounces; the <b>diffusion tail</b> is the smooth wash after them, which you can filter so it isn't boomy or fizzy.",
    you:"Your <b>main pad</b> stacks a low+high-cut reverb, then a high-cut reverb — the filters shape the wash so it doesn't muddy the lows or fizz up top.",
    tryThis:"On a vocal: Predelay ~20 ms (keeps words clear), Decay ~1.8 s, then high-cut the reverb so the tail isn't harsh. Bypass to hear how dry it was.",
    jargon:[["Predelay","the pause before the reverb starts. Longer = bigger-feeling room, and it keeps the dry sound clear."],["Decay","how long the reverb tail takes to die away."],["Early reflections vs diffusion tail","the first distinct wall-bounces vs the smooth wash that follows."]],
    links:[["Manual: Reverb","https://www.ableton.com/en/manual/live-audio-effect-reference/"]] },

  { cat:"time", dev:"Delay filter (the orange dot)",
    prompt:"On the <b>Delay</b>, what does the orange dot in the graph do when you drag it around?",
    answer:"That dot is the Delay's built-in <b>band-pass filter</b>, and it shapes the <b>tone of the echoes</b> (not the dry sound). <b>Drag left/right = frequency</b> — left makes the repeats darker/bassier, right makes them brighter/thinner. <b>Drag up/down = Width</b> — how narrow or wide that band is (narrow = a focused, resonant, telephone-y echo; wide = fuller repeats). Because it's a <i>band-pass</i>, it cuts <b>both</b> below and above the band, so the echoes become a focused slice of the sound. And since the filter sits <b>in the feedback loop</b>, every repeat gets filtered again — so the echoes get progressively more focused as they trail, which keeps a delay from piling into mush.",
    you:"This is the single most useful move on a delay: filter the repeats so they tuck behind the dry sound instead of cluttering. Pull the dot down/left to darken echoes so they sit back.",
    tryThis:"On a synth delay, drag the dot toward the highs and narrow the Width — the echoes turn thin and distant. Then sweep it low — dark and dubby. Same repeats, totally different vibe.",
    jargon:[["Band-pass filter","passes a band of frequencies and cuts both below and above it — the echoes become a focused slice."],["Frequency (dot left/right)","which band the echoes emphasize — left = darker, right = brighter."],["Width (dot up/down)","how narrow or wide that band is — narrow = focused/resonant, wide = fuller."]],
    links:[["Manual: Delay","https://www.ableton.com/en/manual/live-audio-effect-reference/"],["Video","https://www.youtube.com/watch?v=Ss5yOq8nQK4"]] },

  { cat:"time", dev:"Echo vs Delay",
    prompt:"Ableton has both <b>Delay</b> and <b>Echo</b>. When do you reach for which?",
    answer:"They share the same skeleton (two delay lines, sync, feedback, ping-pong), but they're built for different jobs. <b>Delay</b> is the <b>clean, precise utility echo</b> — transparent, one band-pass filter, LFO, smoothing modes. Reach for it when you want a tidy echo that sits neatly out of the way. <b>Echo</b> is the <b>character/vibe echo</b> — it's Delay <i>plus</i> a whole personality: <b>two separate filters</b> (HP + LP with resonance) for fuller tone-sculpting, a <b>Modulation tab</b> (LFO + envelope to wobble time/filter for tape-warble and shimmer), a <b>Character tab</b> (Gate, Ducking, Noise, Wobble — analog grit and tape flutter), and a <b>built-in Reverb</b>. One line: <b>Delay = clean echo; Echo = vintage echo with tone, motion, grit, and space baked in.</b>",
    you:"Anything Delay does, Echo does too — Echo just adds dual filters, modulation, analog character, and reverb. Delay when you want controlled; Echo when you want warm, dubby and full of vibe.",
    tryThis:"Put both on a synth stab at the same 1/8-dotted time. Delay = a clean repeat; Echo with a little Wobble + a low-pass + Ducking = a warm, moving echo that breathes under the dry.",
    jargon:[["Delay","the clean, surgical digital delay — precise and out of the way."],["Echo","the characterful delay — dual filters, modulation, analog 'Character' (noise/wobble), and reverb built in."],["Ducking","(Echo's Character tab) pulls the echoes down while the dry plays, so they bloom in the gaps."]],
